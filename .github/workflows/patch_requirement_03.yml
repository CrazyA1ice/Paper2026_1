name: Temporary patch journal requirement 3

on:
  push:
    paths:
      - ".github/workflows/patch_requirement_03.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporary journal requirement 3 patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix author line formatting if needed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, html, shutil

          path=Path("word_output/2026.09.18v.docx")
          tmp=path.with_suffix(".tmp.docx")
          target="[请填写作者姓名]"

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          def patch_rpr(run):
              m=re.search(r'<w:rPr\b[^>]*>[\s\S]*?</w:rPr>',run)
              rp=m.group(0) if m else '<w:rPr></w:rPr>'
              if re.search(r'<w:rFonts\b[^>]*/>',rp):
                  def fr(fm):
                      tag=fm.group(0)
                      for k,v in [("w:ascii","KaiTi"),("w:hAnsi","KaiTi"),("w:eastAsia","楷体"),("w:cs","KaiTi")]:
                          if re.search(fr'{re.escape(k)}="[^"]*"',tag):
                              tag=re.sub(fr'{re.escape(k)}="[^"]*"',f'{k}="{v}"',tag)
                          else:
                              tag=tag[:-2]+f' {k}="{v}"/>'
                      return tag
                  rp=re.sub(r'<w:rFonts\b[^>]*/>',fr,rp,count=1)
              else:
                  rp=rp.replace('<w:rPr>','<w:rPr><w:rFonts w:ascii="KaiTi" w:hAnsi="KaiTi" w:eastAsia="楷体" w:cs="KaiTi"/>',1)

              if re.search(r'<w:sz\b[^>]*/>',rp):
                  rp=re.sub(r'<w:sz\b[^>]*/>','<w:sz w:val="21"/>',rp,count=1)
              else:
                  rp=rp.replace('</w:rPr>','<w:sz w:val="21"/></w:rPr>')
              if re.search(r'<w:szCs\b[^>]*/>',rp):
                  rp=re.sub(r'<w:szCs\b[^>]*/>','<w:szCs w:val="21"/>',rp,count=1)
              else:
                  rp=rp.replace('</w:rPr>','<w:szCs w:val="21"/></w:rPr>')

              if m:
                  return run[:m.start()]+rp+run[m.end():]
              return run.replace('>', '>'+rp,1)

          def center_para(p):
              pm=re.search(r'<w:pPr\b[^>]*>[\s\S]*?</w:pPr>',p)
              if pm:
                  pp=pm.group(0)
                  if re.search(r'<w:jc\b[^>]*/>',pp):
                      pp=re.sub(r'<w:jc\b[^>]*/>','<w:jc w:val="center"/>',pp,count=1)
                  else:
                      pp=pp.replace('</w:pPr>','<w:jc w:val="center"/></w:pPr>')
                  return p[:pm.start()]+pp+p[pm.end():]
              return p.replace('>', '><w:pPr><w:jc w:val="center"/></w:pPr>',1)

          with ZipFile(path,"r") as zin:
              xml=zin.read("word/document.xml").decode("utf-8")
              match=None
              for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml):
                  if text_of(m.group(0))==target:
                      match=m
                      break
              if match is None:
                  raise RuntimeError("author paragraph not found")

              p=center_para(match.group(0))
              p=re.sub(r'<w:r\b[\s\S]*?</w:r>',lambda m: patch_rpr(m.group(0)) if text_of(m.group(0)) else m.group(0),p)

              # verify explicit required formatting
              if not re.search(r'<w:jc\b[^>]*w:val="center"[^>]*/>',p):
                  raise RuntimeError("author center check failed")
              runs=[r for r in re.findall(r'<w:r\b[\s\S]*?</w:r>',p) if text_of(r)]
              if not runs:
                  raise RuntimeError("author runs missing")
              for r in runs:
                  if not re.search(r'<w:rFonts\b[^>]*w:eastAsia="楷体"[^>]*/>',r):
                      raise RuntimeError("author KaiTi check failed")
                  if not re.search(r'<w:sz\b[^>]*w:val="21"[^>]*/>',r):
                      raise RuntimeError("author 5hao size check failed")

              xml=xml[:match.start()]+p+xml[match.end():]
              with ZipFile(tmp,"w",ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      data=xml.encode("utf-8") if item.filename=="word/document.xml" else zin.read(item.filename)
                      zout.writestr(item,data)

          shutil.move(tmp,path)
          print("author format fixed: centered, KaiTi, 5hao")
          PY

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fc-cache -fv >/dev/null

      - name: Render for QA
        shell: bash
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          pdfinfo qa_render/2026.09.18v.pdf | grep -E 'Pages|Page size'

      - uses: actions/upload-artifact@v4
        with:
          name: journal-requirement-03-qa
          path: qa_render/
          if-no-files-found: error

      - name: Commit manuscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.18v.docx
          git diff --cached --quiet && exit 1
          git commit -m "apply journal requirement 3 author format"
          git push
