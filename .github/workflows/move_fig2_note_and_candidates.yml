name: Move Figure2 note and generate candidates
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move_fig2_note_and_candidates.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-liberation libreoffice-writer poppler-utils
          python -m pip install --upgrade pip
          python -m pip install matplotlib pandas numpy pillow python-docx

      - name: Move Figure 2 note into body
        run: |
          python word_output/move_fig2_note_to_body_v5.py

      - name: Generate four candidate figures
        run: |
          python abilene_forecasting/paper_figures/generate_candidates_v5.py
          test -s abilene_forecasting/paper_figures/candidates_v5/color/candidate_A_router_weight_distribution_color.png
          test -s abilene_forecasting/paper_figures/candidates_v5/color/candidate_B_router_weight_simplex_color.png
          test -s abilene_forecasting/paper_figures/candidates_v5/color/candidate_C_parameter_mse_tradeoff_color.png
          test -s abilene_forecasting/paper_figures/candidates_v5/color/candidate_D_core_model_stability_color.png

      - name: Verify manuscript and candidate source data
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p="word_output/2026.09.20v5.docx"
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          txt="".join(e.text or "" for e in root.iter() if e.tag.endswith("}t"))
          assert "注：a为Abilene，b为GÉANT。" not in txt
          assert "半小提琴表示差值分布" in txt
          assert "ΔMSE>0表示自适应权重模型的MSE更低" in txt
          for name in [
              "router_all_8seeds.csv",
              "router_seed_mean_simplex.csv",
          ]:
              assert (Path("abilene_forecasting/paper_figures/candidates_v5/source_data")/name).exists()
          PY

      - name: Render v5 for QA
        run: |
          rm -rf qa_move_fig2_note_v5
          mkdir -p qa_move_fig2_note_v5
          libreoffice --headless --convert-to pdf --outdir qa_move_fig2_note_v5 word_output/2026.09.20v5.docx
          pdftoppm -png -r 150 qa_move_fig2_note_v5/2026.09.20v5.pdf qa_move_fig2_note_v5/page
          ls -lh qa_move_fig2_note_v5

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            word_output/2026.09.20v5.docx \
            abilene_forecasting/paper_figures/candidates_v5/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Move Figure 2 note to body and add candidate research figures"
            git push
          fi

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-research-figures-v5
          path: |
            abilene_forecasting/paper_figures/candidates_v5/
            word_output/2026.09.20v5.docx
            qa_move_fig2_note_v5/2026.09.20v5.pdf
            qa_move_fig2_note_v5/page-*.png
          retention-days: 2
