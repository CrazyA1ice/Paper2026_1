name: Inspect chapter 2 structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect_chapter2.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect chapter 2
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          import re
          p="word_output/2026.09.19v2.docx"
          NS={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main",
              "a":"http://schemas.openxmlformats.org/drawingml/2006/main",
              "r":"http://schemas.openxmlformats.org/officeDocument/2006/relationships"}
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          body=root.find("w:body",NS)
          children=list(body)

          def txt(el):
              return "".join(e.text or "" for e in el.iter() if e.tag.endswith("}t"))

          in_ch2=False
          for i,el in enumerate(children):
              if el.tag.endswith("}p"):
                  t=txt(el).strip()
                  if t=="2 实验与结果分析":
                      in_ch2=True
                  if in_ch2:
                      drawings=sum(1 for e in el.iter() if e.tag.endswith("}drawing"))
                      print(f"P {i} drawings={drawings}: {t}")
                  if in_ch2 and (t.startswith("3 ") or t=="3 结论" or t.startswith("3　")):
                      break
              elif el.tag.endswith("}tbl") and in_ch2:
                  print(f"TABLE {i}")
                  for ri,row in enumerate(el.findall("w:tr",NS)):
                      vals=[]
                      for cell in row.findall("w:tc",NS):
                          vals.append(txt(cell).strip().replace("\n"," / "))
                      print("  ROW",ri,vals)
          PY
