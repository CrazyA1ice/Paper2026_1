name: Temporary patch journal intro headings

on:
  push:
    paths:
      - ".github/workflows/patch_intro_headings.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporary journal intro headings patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix introduction overlap and second-level heading size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, html, shutil

          path=Path("word_output/2026.09.18v.docx")
          tmp=path.with_suffix(".tmp.docx")

          old_intro="上述研究表明，多尺度信息和频率特征均有助于描述时间序列的复杂变化，但现有多尺度方法多采用固定的尺度组合或较复杂的混合、注意力结构，不同时间尺度在不同流量状态下的重要程度仍缺少简单有效的动态调节机制。同时，网络流量中的突发变化可能分布于中高频成分，过度保留低频信息也可能造成有效预测信息损失。针对上述问题，本文提出一种基于样本级自适应多尺度加权的轻量网络流量预测方法。首先，对输入序列进行尺度1、2和4的非重叠平均池化，构造不同时间分辨率的序列，并分别采用独立DLinear模型进行预测；其次，根据输入窗口的均值、标准差、末时刻均值和平均绝对一阶差分生成样本级尺度权重，实现不同尺度预测结果的自适应融合；最后，引入低频门控作为辅助分析模块，考察不同频率保留比例对预测性能的影响。该方法不依赖显式网络拓扑和复杂注意力结构，重点分析不同时间分辨率信息及其自适应融合对骨干网络OD流量短期预测的作用。"
          new_intro="上述研究表明，多尺度信息和频率特征均有助于描述时间序列的复杂变化，但现有多尺度方法多采用固定尺度组合或较复杂的混合、注意力结构，对不同流量状态下尺度重要性的动态调节仍较有限；同时，过强的低频截断可能造成突发变化等有效信息损失。针对这些问题，本研究构建基于分解线性尺度专家的样本级自适应多尺度预测框架，以不同时间分辨率专家形成互补预测，并由轻量路由器依据输入窗口状态动态分配尺度权重；频域门控仅作为辅助模块，用于分析频率保留边界。该框架不依赖显式网络拓扑和复杂注意力结构，重点验证动态尺度融合对骨干网络OD流量短期预测的作用。"

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          def xml_escape(s):
              return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

          def replace_para_text(p,s):
              first=True
              def repl(m):
                  nonlocal first
                  attrs=m.group(1) or ""
                  if first:
                      first=False
                      return f'<w:t{attrs}>{xml_escape(s)}</w:t>'
                  return f'<w:t{attrs}></w:t>'
              return re.sub(r'<w:t(\s[^>]*)?>([\s\S]*?)</w:t>',repl,p)

          def patch_heading_run(run):
              m=re.search(r'<w:rPr\b[^>]*>[\s\S]*?</w:rPr>',run)
              rp=m.group(0) if m else '<w:rPr></w:rPr>'

              if re.search(r'<w:rFonts\b[^>]*/>',rp):
                  def fr(fm):
                      tag=fm.group(0)
                      if re.search(r'w:eastAsia="[^"]*"',tag):
                          tag=re.sub(r'w:eastAsia="[^"]*"','w:eastAsia="黑体"',tag)
                      else:
                          tag=tag[:-2]+' w:eastAsia="黑体"/>'
                      return tag
                  rp=re.sub(r'<w:rFonts\b[^>]*/>',fr,rp,count=1)
              else:
                  rp=rp.replace('<w:rPr>','<w:rPr><w:rFonts w:eastAsia="黑体"/>',1)

              if '<w:b/>' not in rp and not re.search(r'<w:b\b[^>]*/>',rp):
                  rp=rp.replace('</w:rPr>','<w:b/></w:rPr>')

              # Five-point Chinese size = 10.5 pt = 21 half-points.
              if re.search(r'<w:sz\b[^>]*/>',rp):
                  rp=re.sub(r'<w:sz\b[^>]*/>','<w:sz w:val="21"/>',rp,count=1)
              else:
                  rp=rp.replace('</w:rPr>','<w:sz w:val="21"/></w:rPr>')
              if re.search(r'<w:szCs\b[^>]*/>',rp):
                  rp=re.sub(r'<w:szCs\b[^>]*/>','<w:szCs w:val="21"/>',rp,count=1)
              else:
                  rp=rp.replace('</w:rPr>','<w:szCs w:val="21"/></w:rPr>')

              if m:
                  return run[:m.start()]+rp+run[m.end():]
              return run.replace('>', '>'+rp,1)

          with ZipFile(path,"r") as zin:
              xml=zin.read("word/document.xml").decode("utf-8")
              matches=list(re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml))
              texts=[text_of(m.group(0)) for m in matches]

              intro_hits=[i for i,t in enumerate(texts) if t==old_intro]
              if intro_hits != [14]:
                  raise RuntimeError(f"unexpected intro target: {intro_hits}")

              out=[]
              pos=0
              l2_count=0
              for i,m in enumerate(matches):
                  out.append(xml[pos:m.start()])
                  p=m.group(0)
                  t=texts[i]

                  if i==14:
                      p=replace_para_text(p,new_intro)

                  if re.match(r'^\d+\.\d+\s+\S',t):
                      p=re.sub(r'<w:r\b[\s\S]*?</w:r>',lambda rm: patch_heading_run(rm.group(0)) if text_of(rm.group(0)) else rm.group(0),p)
                      l2_count+=1

                  out.append(p)
                  pos=m.end()
              out.append(xml[pos:])
              new_xml=''.join(out)

              if l2_count != 11:
                  raise RuntimeError(f"unexpected L2 heading count: {l2_count}")

              new_texts=[text_of(m.group(0)) for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',new_xml)]
              if new_intro not in new_texts:
                  raise RuntimeError("new intro paragraph missing")

              # Verify every L2 text run has 黑体 and 21-half-point size.
              new_paras=[m.group(0) for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',new_xml)]
              for p,t in zip(new_paras,new_texts):
                  if re.match(r'^\d+\.\d+\s+\S',t):
                      runs=[r for r in re.findall(r'<w:r\b[\s\S]*?</w:r>',p) if text_of(r)]
                      for r in runs:
                          if not re.search(r'<w:rFonts\b[^>]*w:eastAsia="黑体"[^>]*/>',r):
                              raise RuntimeError(f"L2 font verify failed: {t}")
                          if not re.search(r'<w:sz\b[^>]*w:val="21"[^>]*/>',r):
                              raise RuntimeError(f"L2 size verify failed: {t}")

              with ZipFile(tmp,"w",ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      data=new_xml.encode("utf-8") if item.filename=="word/document.xml" else zin.read(item.filename)
                      zout.writestr(item,data)

          shutil.move(tmp,path)
          print("STATUS=FIXED")
          PY

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fc-cache -fv >/dev/null

      - name: Render for QA
        shell: bash
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          pdfinfo qa_render/2026.09.18v.pdf | grep -E 'Pages|Page size'

      - uses: actions/upload-artifact@v4
        with:
          name: journal-intro-headings-qa
          path: qa_render/
          if-no-files-found: error

      - name: Commit manuscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.18v.docx
          git diff --cached --quiet && exit 1
          git commit -m "align introduction and heading format with journal"
          git push
