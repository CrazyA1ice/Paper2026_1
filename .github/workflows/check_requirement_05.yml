name: Temporary check journal requirement 5

on:
  push:
    paths:
      - ".github/workflows/check_requirement_05.yml"

permissions:
  contents: read

jobs:
  check:
    if: github.event.head_commit.message == 'temporary journal requirement 5 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect abstract, introduction, and conclusion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re, html

          path=Path("word_output/2026.09.18v.docx")
          with ZipFile(path,"r") as z:
              xml=z.read("word/document.xml").decode("utf-8")

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          paras=[text_of(m.group(0)) for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml)]

          abstract=next(t for t in paras if t.startswith("摘要："))
          body=abstract[len("摘要："):]
          cnchars=''.join(re.findall(r'[\\u4e00-\\u9fff]',body))
          no_space_len=len(re.sub(r'\\s+','',body))
          forbidden=[w for w in ["本文","我们","作者","笔者"] if w in body]

          print("ABSTRACT="+abstract)
          print("ABSTRACT_CN_CHARS="+str(len(cnchars)))
          print("ABSTRACT_NO_SPACE_CHARS="+str(no_space_len))
          print("FORBIDDEN="+(",".join(forbidden) if forbidden else "NONE"))

          for i,t in enumerate(paras[:35]):
              if t:
                  print(f"FIRST[{i}]={t}")
          for i,t in enumerate(paras[-35:],len(paras)-35):
              if t:
                  print(f"LAST[{i}]={t}")
          PY
