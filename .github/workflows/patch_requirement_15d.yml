name: Temporary patch journal requirement 15d

on:
  push:
    paths:
      - ".github/workflows/patch_requirement_15d.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporary journal requirement 15d patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix remaining vector typography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, html, shutil

          path=Path("word_output/2026.09.18v.docx")
          tmp=path.with_suffix(".tmp.docx")

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              vals += re.findall(r'<m:t>([\s\S]*?)</m:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          def set_bi(run):
              mrpr=re.search(r'<m:rPr\b[^>]*>[\s\S]*?</m:rPr>',run)
              if mrpr:
                  rp=mrpr.group(0)
                  if re.search(r'<m:sty\b[^>]*/>',rp):
                      rp=re.sub(r'<m:sty\b[^>]*/>','<m:sty m:val="bi"/>',rp,count=1)
                  else:
                      rp=rp.replace('</m:rPr>','<m:sty m:val="bi"/></m:rPr>')
                  return run[:mrpr.start()]+rp+run[mrpr.end():]
              return run.replace('<m:r>','<m:r><m:rPr><m:sty m:val="bi"/></m:rPr>',1)

          with ZipFile(path,"r") as zin:
              xml=zin.read("word/document.xml").decode("utf-8")
              paras=list(re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml))
              changed=0
              out=[]; pos=0

              for pm in paras:
                  out.append(xml[pos:pm.start()])
                  p=pm.group(0)
                  t=text_of(p)

                  eqnum=None
                  mnum=re.match(r'\((\d+)\)',t)
                  if mnum:
                      eqnum=int(mnum.group(1))

                  if eqnum in (8,11):
                      def patch_math_run(rm):
                          nonlocal_changed=[False]
                          r=rm.group(0)
                          mt=re.search(r'<m:t>([\s\S]*?)</m:t>',r)
                          if not mt:
                              return r
                          token=html.unescape(mt.group(1))
                          should=(eqnum==8 and token=="b") or (eqnum==11 and token in ("a","b"))
                          if should:
                              nonlocal_changed[0]=True
                              return set_bi(r)
                          return r

                      before=p
                      p=re.sub(r'<m:r\b[\s\S]*?</m:r>',patch_math_run,p)
                      if p!=before:
                          # Count targeted symbol runs after patch.
                          changed += sum(
                              1 for r in re.findall(r'<m:r\b[\s\S]*?</m:r>',p)
                              if re.search(r'<m:t>(a|b)</m:t>',r) and re.search(r'<m:sty\b[^>]*m:val="bi"[^>]*/>',r)
                          )

                  out.append(p)
                  pos=pm.end()
              out.append(xml[pos:])
              new_xml=''.join(out)

              # Verify exact intended behavior.
              new_paras=[m.group(0) for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',new_xml)]
              for p in new_paras:
                  t=text_of(p)
                  mnum=re.match(r'\((\d+)\)',t)
                  if not mnum: continue
                  n=int(mnum.group(1))
                  runs=re.findall(r'<m:r\b[\s\S]*?</m:r>',p)
                  if n==8:
                      bs=[r for r in runs if '<m:t>b</m:t>' in r]
                      if len(bs)!=2 or not all(re.search(r'<m:sty\b[^>]*m:val="bi"[^>]*/>',r) for r in bs):
                          raise RuntimeError("equation 8 bias vectors not bold italic")
                  if n==11:
                      aa=[r for r in runs if '<m:t>a</m:t>' in r]
                      bs=[r for r in runs if '<m:t>b</m:t>' in r]
                      if len(aa)!=1 or not re.search(r'<m:sty\b[^>]*m:val="bi"[^>]*/>',aa[0]):
                          raise RuntimeError("equation 11 score vector a not bold italic")
                      if len(bs)!=2 or not all(re.search(r'<m:sty\b[^>]*m:val="bi"[^>]*/>',r) for r in bs):
                          raise RuntimeError("equation 11 bias vectors not bold italic")
                  if n==12:
                      aa=[r for r in runs if '<m:t>a</m:t>' in r]
                      if any(re.search(r'<m:sty\b[^>]*m:val="bi"[^>]*/>',r) for r in aa):
                          raise RuntimeError("equation 12 scalar score components were incorrectly bolded")

              if new_xml==xml:
                  raise RuntimeError("no manuscript change made")

              with ZipFile(tmp,"w",ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      data=new_xml.encode("utf-8") if item.filename=="word/document.xml" else zin.read(item.filename)
                      zout.writestr(item,data)

          shutil.move(tmp,path)
          print("STATUS=FIXED")
          PY

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fc-cache -fv >/dev/null

      - name: Render full manuscript
        shell: bash
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          pdfinfo qa_render/2026.09.18v.pdf | grep -E 'Pages|Page size'

      - uses: actions/upload-artifact@v4
        with:
          name: journal-requirement-15-qa
          path: qa_render/
          if-no-files-found: error

      - name: Commit manuscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.18v.docx
          git diff --cached --quiet && exit 1
          git commit -m "finish journal requirement 15 vector typography"
          git push
