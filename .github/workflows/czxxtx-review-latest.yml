name: Review latest Changjiang paper (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'paper_template/长江信息通信/格式核对工作_20261027/review_latest_20261027.py'
      - '.github/workflows/czxxtx-review-latest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup audit readers
        run: python -m pip install --disable-pip-version-check python-docx lxml pillow
      - name: Audit paper contents and format
        run: python "paper_template/长江信息通信/格式核对工作_20261027/review_latest_20261027.py"
      - name: Commit machine-check result (no manuscript edits)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "paper_template/长江信息通信/格式核对工作_20261027/最新投稿稿_整体核查记录.json"
          git commit -m "Record latest 20261027 paper read-only audit [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
