name: Rewrite abstract conclusion v2
# rerun after XML spacing syntax fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rewrite_abstract_conclusion_v2.yml'
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk fonts-liberation
          python -m pip install --upgrade pip
          python -m pip install lxml

      - name: Rewrite abstract keywords conclusion
        run: |
          python word_output/rewrite_abstract_conclusion_v2.py

      - name: Verify target text only
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          p="word_output/2026.09.19v2.docx"
          NS={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          body=root.find("w:body",NS)
          ps=[e for e in body if e.tag.endswith("}p")]
          def txt(e):
              return "".join(x.text or "" for x in e.iter() if x.tag.endswith("}t"))
          targets=[]
          for i,e in enumerate(ps):
              t=txt(e).strip()
              if t.startswith("摘要：") or t.startswith("关键词：") or t.startswith("Abstract:") or t.startswith("Key words:") or t=="3 结论":
                  print(i,t)
              if i>0 and txt(ps[i-1]).strip()=="3 结论":
                  print(i,t)
          alltxt="\n".join(txt(e) for e in ps)
          assert "频域分析" not in txt(next(e for e in ps if txt(e).strip().startswith("关键词：")))
          assert "frequency-domain analysis" not in txt(next(e for e in ps if txt(e).strip().startswith("Key words:")))
          assert "GÉANT" in txt(next(e for e in ps if txt(e).strip().startswith("摘要：")))
          assert "LightTS" in txt(next(e for e in ps if txt(e).strip().startswith("Abstract:")))
          PY

      - name: Render full manuscript
        run: |
          rm -rf qa_abstract_conclusion_v2
          mkdir -p qa_abstract_conclusion_v2
          libreoffice --headless --convert-to pdf --outdir qa_abstract_conclusion_v2 word_output/2026.09.19v2.docx
          pdftoppm -png -r 150 qa_abstract_conclusion_v2/2026.09.19v2.pdf qa_abstract_conclusion_v2/page
          ls -lh qa_abstract_conclusion_v2

      - name: Commit abstract and conclusion rewrite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.19v2.docx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Rewrite abstracts keywords and conclusion for final evidence"
            git push
          fi

      - name: Upload QA
        uses: actions/upload-artifact@v4
        with:
          name: abstract-conclusion-v2-qa
          path: |
            word_output/2026.09.19v2.docx
            qa_abstract_conclusion_v2/2026.09.19v2.pdf
            qa_abstract_conclusion_v2/page-*.png
          retention-days: 2
