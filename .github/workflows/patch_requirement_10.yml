name: Temporary patch journal requirement 10

on:
  push:
    paths:
      - ".github/workflows/patch_requirement_10.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporary journal requirement 10 patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix body typography and first-use abbreviations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, html, shutil

          path=Path("word_output/2026.09.18v.docx")
          tmp=path.with_suffix(".tmp.docx")

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          def xml_escape(s):
              return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

          def replace_text_nodes(p, replacements):
              def repl(m):
                  attrs=m.group(1) or ""
                  raw=html.unescape(m.group(2))
                  new=raw
                  for a,b in replacements:
                      new=new.replace(a,b)
                  return f'<w:t{attrs}>{xml_escape(new)}</w:t>'
              return re.sub(r'<w:t(\s[^>]*)?>([\s\S]*?)</w:t>',repl,p)

          def patch_run_body(run):
              # Keep equation/math runs untouched.
              if "Cambria Math" in run:
                  return run
              if not text_of(run):
                  return run

              m=re.search(r'<w:rPr\b[^>]*>[\s\S]*?</w:rPr>',run)
              rp=m.group(0) if m else '<w:rPr></w:rPr>'

              # Chinese font: explicit SimSun/宋体; preserve Western font settings.
              if re.search(r'<w:rFonts\b[^>]*/>',rp):
                  def font_repl(fm):
                      tag=fm.group(0)
                      if re.search(r'w:eastAsia="[^"]*"',tag):
                          tag=re.sub(r'w:eastAsia="[^"]*"','w:eastAsia="宋体"',tag)
                      else:
                          tag=tag[:-2]+' w:eastAsia="宋体"/>'
                      return tag
                  rp=re.sub(r'<w:rFonts\b[^>]*/>',font_repl,rp,count=1)
              else:
                  rp=rp.replace('<w:rPr>','<w:rPr><w:rFonts w:eastAsia="宋体"/>',1)

              # 5号 = 10.5 pt = 21 half-points.
              if re.search(r'<w:sz\b[^>]*/>',rp):
                  rp=re.sub(r'<w:sz\b[^>]*/>','<w:sz w:val="21"/>',rp,count=1)
              else:
                  rp=rp.replace('</w:rPr>','<w:sz w:val="21"/></w:rPr>')
              if re.search(r'<w:szCs\b[^>]*/>',rp):
                  rp=re.sub(r'<w:szCs\b[^>]*/>','<w:szCs w:val="21"/>',rp,count=1)
              else:
                  rp=rp.replace('</w:rPr>','<w:szCs w:val="21"/></w:rPr>')

              if m:
                  return run[:m.start()]+rp+run[m.end():]
              return run.replace('>', '>'+rp,1)

          with ZipFile(path,"r") as zin:
              xml=zin.read("word/document.xml").decode("utf-8")
              matches=list(re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml))
              texts=[text_of(m.group(0)) for m in matches]
              key_idx=next(i for i,t in enumerate(texts) if t.startswith("Key words:"))
              ref_idx=next(i for i,t in enumerate(texts) if t=="参考文献")

              target_repls={
                  12:[("大型IP网络流量矩阵","大型互联网协议（Internet Protocol，IP）网络流量矩阵")],
                  13:[
                      ("FEDformer","频率增强分解Transformer（Frequency Enhanced Decomposed Transformer，FEDformer）"),
                      ("FITS","频率插值时间序列分析（Frequency Interpolation Time Series Analysis，FITS）"),
                      ("DLinear","分解线性（Decomposition Linear，DLinear）模型")
                  ],
                  55:[("RFFT共有","实值快速傅里叶变换（real fast Fourier transform，RFFT）共有")],
                  63:[("验证集MSE","验证集均方误差")]
              }

              out=[]
              pos=0
              changed_targets=set()
              for i,m in enumerate(matches):
                  out.append(xml[pos:m.start()])
                  p=m.group(0)
                  t=texts[i]

                  if i in target_repls:
                      oldp=p
                      p=replace_text_nodes(p,target_repls[i])
                      if p==oldp:
                          raise RuntimeError(f"target replacement failed at paragraph {i}: {t}")
                      changed_targets.add(i)

                  # Main body typography only: after English keywords and before references.
                  if key_idx < i < ref_idx and t:
                      is_heading=bool(re.match(r'^\d+(?:\.\d+)*\s',t))
                      is_caption=t.startswith(("图","表"))
                      is_equation_number=bool(re.fullmatch(r'\(\d+\)',t))
                      is_ref_heading=(t=="参考文献")
                      if not (is_heading or is_caption or is_equation_number or is_ref_heading):
                          p=re.sub(r'<w:r\b[\s\S]*?</w:r>',lambda rm: patch_run_body(rm.group(0)),p)

                  out.append(p)
                  pos=m.end()
              out.append(xml[pos:])
              new_xml=''.join(out)

              expected=set(target_repls.keys())
              if changed_targets!=expected:
                  raise RuntimeError(f"not all target paragraphs changed: {changed_targets} vs {expected}")

              # Re-extract text and verify first-use issues.
              new_texts=[text_of(m.group(0)) for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',new_xml)]
              checks=[
                  ("IP","Internet Protocol，IP"),
                  ("FEDformer","Frequency Enhanced Decomposed Transformer，FEDformer"),
                  ("FITS","Frequency Interpolation Time Series Analysis，FITS"),
                  ("DLinear","Decomposition Linear，DLinear"),
                  ("RFFT","real fast Fourier transform，RFFT")
              ]
              for abbr,marker in checks:
                  hits=[(i,t) for i,t in enumerate(new_texts[:ref_idx]) if re.search(r'(?<![A-Za-z])'+re.escape(abbr)+r'(?![A-Za-z])',t)]
                  if not hits:
                      raise RuntimeError(f"{abbr} missing after patch")
                  # For DLinear, English Abstract precedes Chinese body and already defines it.
                  if abbr=="DLinear":
                      if not any(marker in t for i,t in hits):
                          raise RuntimeError("Chinese DLinear expansion missing")
                  elif marker not in hits[0][1]:
                      raise RuntimeError(f"first {abbr} occurrence lacks expansion: {hits[0]}")

              # MSE must not occur before its formal definition paragraph.
              mse_hits=[(i,t) for i,t in enumerate(new_texts[:ref_idx]) if re.search(r'(?<![A-Za-z])MSE(?![A-Za-z])',t)]
              if not mse_hits or "均方误差（mean squared error，MSE）" not in mse_hits[0][1]:
                  raise RuntimeError(f"MSE first occurrence not defined: {mse_hits[:1]}")

              with ZipFile(tmp,"w",ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      data=new_xml.encode("utf-8") if item.filename=="word/document.xml" else zin.read(item.filename)
                      zout.writestr(item,data)

          shutil.move(tmp,path)
          print("STATUS=FIXED")
          PY

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fc-cache -fv >/dev/null

      - name: Render for QA
        shell: bash
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          pdfinfo qa_render/2026.09.18v.pdf | grep -E 'Pages|Page size'

      - uses: actions/upload-artifact@v4
        with:
          name: journal-requirement-10-qa
          path: qa_render/
          if-no-files-found: error

      - name: Commit manuscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.18v.docx
          git diff --cached --quiet && exit 1
          git commit -m "apply journal requirement 10 body and terminology"
          git push
