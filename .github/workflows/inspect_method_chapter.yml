name: Inspect equation numbering after method
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect_method_chapter.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract later equation paragraphs
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          import re
          with ZipFile("word_output/2026.09.19v1.docx") as z:
              root=ET.fromstring(z.read("word/document.xml"))
          ns={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          body=root.find("w:body",ns)
          for i,p in enumerate(list(body)):
              if not p.tag.endswith("}p"):
                  continue
              t="".join(e.text or "" for e in p.iter() if e.tag.endswith("}t"))
              if i>=62 and (re.search(r"\(\d+\)", t) or re.search(r"\d+\s",t) or "MSE" in t or "MAE" in t or "RMSE" in t or "评价指标" in t):
                  print(f"PARA {i}: {t}")
          PY
