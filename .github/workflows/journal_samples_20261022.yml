name: Read journal reference samples
on:
  push:
    branches: [paper-coherence-review-20261022]
    paths: ['.github/workflows/journal_samples_20261022.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pymupdf
      - run: python review_scratch/extract_journal_samples_20261022.py
      - uses: actions/upload-artifact@v4
        with:
          name: journal-three-samples
          path: |
            paper_template/长春工程学院学报(自然科学版)/*.pdf
            review_scratch/journal_sample_review_20261022/
          retention-days: 2
