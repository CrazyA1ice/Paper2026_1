name: Debug v21 build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug_v21.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-liberation libreoffice-writer poppler-utils
          python -m pip install python-docx pillow
      - name: Run builder
        run: |
          set +e
          python word_output/rewrite_v20_to_v21_from_aigc_report.py > word_output/v21_build_log.txt 2>&1
          code=$?
          echo "exit_code=$code" >> word_output/v21_build_log.txt
          if [ -f word_output/2026.09.21v21.docx ]; then
            rm -rf word_output/render_v21_word
            mkdir -p word_output/render_v21_word
            libreoffice --headless --convert-to pdf --outdir word_output/render_v21_word word_output/2026.09.21v21.docx >> word_output/v21_build_log.txt 2>&1
            pdftoppm -png -r 170 word_output/render_v21_word/2026.09.21v21.pdf word_output/render_v21_word/page >> word_output/v21_build_log.txt 2>&1
          fi
          exit 0
      - name: Commit diagnostics and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/v21_build_log.txt
          git add word_output/2026.09.21v21.docx word_output/render_v21_word/ 2>/dev/null || true
          git commit -m "Capture v21 build diagnostics" || exit 0
          git push

