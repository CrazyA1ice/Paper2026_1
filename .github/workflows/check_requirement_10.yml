name: Temporary check journal requirement 10

on:
  push:
    paths:
      - ".github/workflows/check_requirement_10.yml"

permissions:
  contents: read

jobs:
  check:
    if: github.event.head_commit.message == 'temporary journal requirement 10 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect body formatting, length, and abbreviations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re, html

          path=Path("word_output/2026.09.18v.docx")
          with ZipFile(path,"r") as z:
              xml=z.read("word/document.xml").decode("utf-8")
              styles=z.read("word/styles.xml").decode("utf-8")

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          paras=[m.group(0) for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml)]
          texts=[text_of(p) for p in paras]

          # document defaults
          d=re.search(r'<w:docDefaults>[\s\S]*?</w:docDefaults>',styles)
          print("DOCDEFAULTS="+(d.group(0) if d else "NONE"))

          # Identify main body start/end: first intro paragraph after English keywords, through conclusion.
          kw_idx=next(i for i,t in enumerate(texts) if t.startswith("Key words:"))
          ref_idx=next(i for i,t in enumerate(texts) if t=="参考文献")
          body_indices=[i for i in range(kw_idx+1,ref_idx) if texts[i]]
          body_text=''.join(texts[i] for i in body_indices)
          body_no_space=len(re.sub(r'\s+','',body_text))
          body_cn=len(re.findall(r'[\u4e00-\u9fff]',body_text))

          # Front matter + body, excluding references.
          manuscript_text=''.join(t for t in texts[:ref_idx] if t)
          manuscript_no_space=len(re.sub(r'\s+','',manuscript_text))
          manuscript_cn=len(re.findall(r'[\u4e00-\u9fff]',manuscript_text))

          print(f"LENGTH body_no_space={body_no_space} body_cn={body_cn} manuscript_no_space={manuscript_no_space} manuscript_cn={manuscript_cn}")

          # Inspect representative normal Chinese prose paragraphs (not headings/captions/formulas/tables).
          samples=[]
          for i in body_indices:
              t=texts[i]
              if len(t)<30: continue
              if t.startswith(("图","表")): continue
              if re.match(r'^\d+(?:\.\d+)*\s',t): continue
              samples.append(i)
              if len(samples)>=8: break

          for i in samples:
              p=paras[i]
              runs=[r for r in re.findall(r'<w:r\b[\s\S]*?</w:r>',p) if text_of(r)]
              print(f"SAMPLE[{i}]={texts[i][:100]}")
              for j,r in enumerate(runs[:6]):
                  fm=re.search(r'<w:rFonts\b[^>]*/>',r)
                  sz=re.search(r'<w:sz\b[^>]*/>',r)
                  print(f"  RUN[{j}] text={text_of(r)[:35]} fonts={fm.group(0) if fm else None} size={sz.group(0) if sz else None}")

          # Search abbreviation occurrences in order.
          abbreviations=["OD","IP","MSE","MAE","RMSE","CI","FITS","DLinear","RFFT","Softmax","Adam","GPU","CPU"]
          for abbr in abbreviations:
              hits=[(i,t) for i,t in enumerate(texts[:ref_idx]) if re.search(r'(?<![A-Za-z])'+re.escape(abbr)+r'(?![A-Za-z])',t)]
              if hits:
                  print(f"ABBR {abbr} FIRST[{hits[0][0]}]={hits[0][1]}")
                  print(f"ABBR {abbr} COUNT={len(hits)}")
          PY
