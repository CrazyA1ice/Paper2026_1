name: Temporary patch journal requirement 11

on:
  push:
    paths:
      - ".github/workflows/patch_requirement_11.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporary journal requirement 11 patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize first-page footer metadata template
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, html, shutil

          path=Path("word_output/2026.09.18v.docx")
          tmp=path.with_suffix(".tmp.docx")

          replacements={
              "收稿日期：":"收稿日期：[请填写，格式YYYY-MM-DD]",
              "基金项目：":"基金项目：[基金来源]（[基金项目编号]）",
              "第一作者简介：":"第一作者简介：[姓名]（[出生年]—），[性别（民族，汉族可省略）]，[职称]，[学位（若在读请注明）]，研究方向：[方向1]；[方向2]。",
              "通信作者简介：":"通信作者简介：[姓名]（[出生年]—），[性别（民族，汉族可省略）]，[职称]，[学位（若在读请注明）]，研究方向：[方向1]；[方向2]，电子邮箱：[邮箱]。"
          }

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          def esc(s):
              return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

          def replace_para_text(p,s):
              first=True
              def repl(m):
                  nonlocal first
                  attrs=m.group(1) or ""
                  if first:
                      first=False
                      return f'<w:t{attrs}>{esc(s)}</w:t>'
                  return f'<w:t{attrs}></w:t>'
              return re.sub(r'<w:t(\s[^>]*)?>([\s\S]*?)</w:t>',repl,p)

          with ZipFile(path,"r") as zin:
              footer=zin.read("word/footer1.xml").decode("utf-8")
              doc=zin.read("word/document.xml").decode("utf-8")

              # Verify this footer is specifically the first-page footer.
              sect=re.search(r'<w:sectPr\b[\s\S]*?</w:sectPr>',doc)
              if not sect or '<w:footerReference w:type="first"' not in sect.group(0) or '<w:titlePg/>' not in sect.group(0):
                  raise RuntimeError("footer1 is not configured as a first-page footer")

              matches=list(re.finditer(r'<w:p\b[\s\S]*?</w:p>',footer))
              texts=[text_of(m.group(0)) for m in matches]

              targets={}
              for prefix in replacements:
                  hits=[i for i,t in enumerate(texts) if t.startswith(prefix)]
                  if len(hits)!=1:
                      raise RuntimeError(f"expected one footer paragraph for {prefix}, got {hits}")
                  targets[hits[0]]=(prefix,replacements[prefix])

              out=[]
              pos=0
              for i,m in enumerate(matches):
                  out.append(footer[pos:m.start()])
                  p=m.group(0)
                  if i in targets:
                      p=replace_para_text(p,targets[i][1])
                  out.append(p)
                  pos=m.end()
              out.append(footer[pos:])
              new_footer=''.join(out)

              # Final semantic verification.
              all_text=text_of(new_footer)
              required=[
                  "收稿日期：[请填写，格式YYYY-MM-DD]",
                  "基金项目：[基金来源]（[基金项目编号]）",
                  "第一作者简介：[姓名]",
                  "民族，汉族可省略",
                  "学位（若在读请注明）",
                  "通信作者简介：[姓名]",
                  "电子邮箱：[邮箱]"
              ]
              for s in required:
                  if s not in all_text:
                      raise RuntimeError(f"footer verification failed: {s}")
              if "如无基金项目请填写" in all_text:
                  raise RuntimeError("submission instruction remains in footer")

              with ZipFile(tmp,"w",ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename=="word/footer1.xml":
                          data=new_footer.encode("utf-8")
                      else:
                          data=zin.read(item.filename)
                      zout.writestr(item,data)

          shutil.move(tmp,path)
          print("STATUS=FIXED")
          PY

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fc-cache -fv >/dev/null

      - name: Render for QA
        shell: bash
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          pdfinfo qa_render/2026.09.18v.pdf | grep -E 'Pages|Page size'

      - uses: actions/upload-artifact@v4
        with:
          name: journal-requirement-11-qa
          path: qa_render/
          if-no-files-found: error

      - name: Commit manuscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.18v.docx
          git diff --cached --quiet && exit 1
          git commit -m "apply journal requirement 11 first-page footer"
          git push
