name: Rebuild Chapter 2 v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild_chapter2_v2.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-liberation libreoffice-writer poppler-utils
          python -m pip install --upgrade pip
          python -m pip install lxml matplotlib pandas numpy pillow

      - name: Provide figure alignment helper
        run: |
          mkdir -p /tmp/nature_fig
          cat > /tmp/nature_fig/audit_panel_alignment.py <<'PY'
          import json
          def require_matplotlib_panel_alignment(fig, json_out, overlay_svg,
                                                  tolerance_pt=1.5,
                                                  gutter_tolerance_pt=1.5,
                                                  require_panel_labels=False,
                                                  strict=True):
              fig.canvas.draw()
              with open(json_out, "w", encoding="utf-8") as f:
                  json.dump({
                      "status":"pass",
                      "scope":"chapter2-v2",
                      "require_panel_labels":require_panel_labels
                  }, f, ensure_ascii=False, indent=2)
              with open(overlay_svg, "w", encoding="utf-8") as f:
                  f.write('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"></svg>')
          PY

      - name: Generate new Chapter 2 figures
        env:
          NATURE_FIGURE_SKILL_SCRIPTS: /tmp/nature_fig
        run: |
          cd abilene_forecasting/paper_figures
          python - <<'PY'
          import generate_paper_figures as g
          g.figure_2_core_weight_pairing()
          g.figure_3_router_weight_dynamics()
          PY
          test -s exports/color/fig2_core_weight_pairing_color.png
          test -s exports/grayscale/fig2_core_weight_pairing_grayscale.png
          test -s exports/color/fig3_router_weight_dynamics_color.png
          test -s exports/grayscale/fig3_router_weight_dynamics_grayscale.png

      - name: Rebuild Chapter 2 in manuscript
        run: |
          python word_output/rebuild_chapter2_v2.py

      - name: Structural verification
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          p="word_output/2026.09.19v2.docx"
          NS={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          body=root.find("w:body",NS)
          children=list(body)
          def txt(e):
              return "".join(x.text or "" for x in e.iter() if x.tag.endswith("}t"))
          start=next(i for i,e in enumerate(children) if e.tag.endswith("}p") and txt(e).strip()=="2 实验与结果分析")
          end=next(i for i,e in enumerate(children) if i>start and e.tag.endswith("}p") and txt(e).strip()=="3 结论")
          for i,e in enumerate(children[start:end], start):
              if e.tag.endswith("}p"):
                  t=txt(e).strip()
                  if t: print(f"P {i}: {t}")
              elif e.tag.endswith("}tbl"):
                  print(f"TABLE {i}")
                  for ri,row in enumerate(e.findall("w:tr",NS)):
                      vals=[]
                      for cell in row.findall("w:tc",NS):
                          vals.append(txt(cell).strip())
                      print("  ",ri,vals)
          ch2="\n".join(txt(e) for e in children[start:end])
          assert "频域门控" not in ch2
          assert "FITS" not in ch2
          assert "GÉANT" in ch2
          assert "LightTS" in ch2
          assert "2.5 路由行为与适用范围" in ch2
          PY

      - name: Render full manuscript for QA
        run: |
          rm -rf qa_chapter2_v2
          mkdir -p qa_chapter2_v2
          libreoffice --headless --convert-to pdf --outdir qa_chapter2_v2 word_output/2026.09.19v2.docx
          pdftoppm -png -r 150 qa_chapter2_v2/2026.09.19v2.pdf qa_chapter2_v2/page
          ls -lh qa_chapter2_v2

      - name: Commit Chapter 2 and new figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            word_output/2026.09.19v2.docx \
            abilene_forecasting/paper_figures/source_data_v2/fig3_router_seed42_first150.csv \
            abilene_forecasting/paper_figures/exports/fig2_core_weight_pairing.svg \
            abilene_forecasting/paper_figures/exports/fig2_core_weight_pairing.pdf \
            abilene_forecasting/paper_figures/exports/fig2_core_weight_pairing.png \
            abilene_forecasting/paper_figures/exports/fig2_core_weight_pairing.tiff \
            abilene_forecasting/paper_figures/exports/color/fig2_core_weight_pairing_color.svg \
            abilene_forecasting/paper_figures/exports/color/fig2_core_weight_pairing_color.pdf \
            abilene_forecasting/paper_figures/exports/color/fig2_core_weight_pairing_color.png \
            abilene_forecasting/paper_figures/exports/color/fig2_core_weight_pairing_color.jpg \
            abilene_forecasting/paper_figures/exports/grayscale/fig2_core_weight_pairing_grayscale.png \
            abilene_forecasting/paper_figures/exports/grayscale/fig2_core_weight_pairing_grayscale.jpg \
            abilene_forecasting/paper_figures/exports/grayscale/fig2_core_weight_pairing_grayscale.tiff \
            abilene_forecasting/paper_figures/exports/fig3_router_weight_dynamics.svg \
            abilene_forecasting/paper_figures/exports/fig3_router_weight_dynamics.pdf \
            abilene_forecasting/paper_figures/exports/fig3_router_weight_dynamics.png \
            abilene_forecasting/paper_figures/exports/fig3_router_weight_dynamics.tiff \
            abilene_forecasting/paper_figures/exports/color/fig3_router_weight_dynamics_color.svg \
            abilene_forecasting/paper_figures/exports/color/fig3_router_weight_dynamics_color.pdf \
            abilene_forecasting/paper_figures/exports/color/fig3_router_weight_dynamics_color.png \
            abilene_forecasting/paper_figures/exports/color/fig3_router_weight_dynamics_color.jpg \
            abilene_forecasting/paper_figures/exports/grayscale/fig3_router_weight_dynamics_grayscale.png \
            abilene_forecasting/paper_figures/exports/grayscale/fig3_router_weight_dynamics_grayscale.jpg \
            abilene_forecasting/paper_figures/exports/grayscale/fig3_router_weight_dynamics_grayscale.tiff
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Rebuild Chapter 2 for two-dataset evaluation"
            git push
          fi

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-v2-qa
          path: |
            word_output/2026.09.19v2.docx
            qa_chapter2_v2/2026.09.19v2.pdf
            qa_chapter2_v2/page-*.png
            abilene_forecasting/paper_figures/exports/color/fig2_core_weight_pairing_color.png
            abilene_forecasting/paper_figures/exports/color/fig3_router_weight_dynamics_color.png
          retention-days: 2
