name: Temporary patch manuscript section 2.5

on:
  push:
    paths:
      - ".github/workflows/patch_manuscript_2_5.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporary manuscript patch 2.5 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current DOCX in place
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, shutil, html

          path = Path("word_output/2026.09.18v.docx")
          tmp = path.with_suffix(".tmp.docx")

          def para_text(pxml: str) -> str:
              vals = re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>', pxml)
              return re.sub(r'\s+', ' ', ''.join(html.unescape(v) for v in vals)).strip()

          def xml_escape(s: str) -> str:
              return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          def replace_para_text(pxml: str, new_text: str) -> str:
              first = True
              def repl(m):
                  nonlocal first
                  attrs = m.group(1) or ""
                  if first:
                      first = False
                      return f'<w:t{attrs}>{xml_escape(new_text)}</w:t>'
                  return f'<w:t{attrs}></w:t>'
              return re.sub(r'<w:t(\s[^>]*)?>([\s\S]*?)</w:t>', repl, pxml)

          replacements = {
              "2.6 代表性预测":
              "2.5 代表性预测与适用范围",

              "为直观展示模型预测效果，选取测试集中具有代表性的 OD 流量窗口进行可视化，结果如图6所示。从应用角度看，预测输出可作为容量与拥塞管理的辅助输入。例如，网络管理系统可用未来24 h的OD流量估计识别可能持续上升的业务对，提前调整链路容量、路由权重或巡检优先级；在资源编排中，可根据预测需求安排带宽和计算资源。":
              "为直观展示模型在具体OD流量窗口上的预测结果，选取测试集中的代表性样本进行可视化，如图6所示。该图主要用于观察预测序列与真实变化趋势的对应关系，不作为独立于表1—表3之外的额外性能证据。从应用角度看，未来24 h的OD流量预测可作为容量规划、拥塞预警和资源编排的辅助输入，为链路容量调整、路由配置及带宽资源分配提供参考。需要指出的是，本文实验仅基于Abilene数据集、固定输入长度L=96和预测长度H=24开展，并以3个随机种子进行重复验证；模型也未显式引入OD节点之间的网络拓扑关系。因此，当前结果主要说明所提出方法在该数据集和预测设置下的有效性，其在其他网络规模、不同预测长度及拓扑条件下的泛化能力仍需进一步验证。"
          }

          with ZipFile(path, "r") as zin:
              xml = zin.read("word/document.xml").decode("utf-8")
              seen = {k: 0 for k in replacements}
              parts, pos = [], 0
              for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>', xml):
                  parts.append(xml[pos:m.start()])
                  p = m.group(0)
                  t = para_text(p)
                  if t in replacements:
                      seen[t] += 1
                      p = replace_para_text(p, replacements[t])
                  parts.append(p)
                  pos = m.end()
              parts.append(xml[pos:])
              new_xml = ''.join(parts)

              bad = {k:v for k,v in seen.items() if v != 1}
              if bad:
                  raise RuntimeError(f"target paragraph match failure: {bad}")

              text_after = "\n".join(para_text(p) for p in re.findall(r'<w:p\b[\s\S]*?</w:p>', new_xml))
              for required in [
                  "图6 代表性窗口预测结果",
                  "3 结论"
              ]:
                  if required not in text_after:
                      raise RuntimeError(f"required neighboring content missing: {required}")

              with ZipFile(tmp, "w", ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      data = new_xml.encode("utf-8") if item.filename == "word/document.xml" else zin.read(item.filename)
                      zout.writestr(item, data)

          shutil.move(tmp, path)
          print("patched", path)
          PY

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fc-cache -fv >/dev/null

      - name: Render modified DOCX for QA
        shell: bash
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          ls -lh qa_render

      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-section-2-5-qa
          path: qa_render/
          if-no-files-found: error

      - name: Commit patched manuscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.18v.docx
          git diff --cached --quiet && exit 1
          git commit -m "revise section 2.5 representative forecast and scope"
          git push
