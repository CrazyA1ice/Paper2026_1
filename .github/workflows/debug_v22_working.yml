name: Debug cumulative v22 working draft
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug_v22_working.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install python-docx
      - name: Run working pipeline
        run: |
          set +e
          python word_output/v22_working_pipeline.py > word_output/v22_working_build_log.txt 2>&1
          code=$?
          echo "exit_code=$code" >> word_output/v22_working_build_log.txt
          exit 0
      - name: Commit log and working draft if generated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/v22_working_build_log.txt
          git add word_output/v22_working.docx 2>/dev/null || true
          git commit -m "Capture cumulative v22 working build diagnostics" || exit 0
          git push
