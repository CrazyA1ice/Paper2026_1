name: Inspect introduction v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect_intro_v2.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect introduction and references
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          p="word_output/2026.09.19v2.docx"
          NS={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          body=root.find("w:body",NS)
          children=list(body)
          def txt(e):
              return "".join(x.text or "" for x in e.iter() if x.tag.endswith("}t"))
          print("=== FRONT/INTRO ===")
          for i,e in enumerate(children):
              if not e.tag.endswith("}p"): continue
              t=txt(e).strip()
              if i < 60 and t:
                  print(f"P {i}: {t}")
              if t=="1 自适应多尺度网络流量预测方法":
                  break
          print("=== REFERENCES ===")
          on=False
          for i,e in enumerate(children):
              if not e.tag.endswith("}p"): continue
              t=txt(e).strip()
              if t=="参考文献": on=True
              if on and t: print(f"P {i}: {t}")
          PY
