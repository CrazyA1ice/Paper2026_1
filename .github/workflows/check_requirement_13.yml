name: Temporary check journal requirement 13

on:
  push:
    paths:
      - ".github/workflows/check_requirement_13.yml"

permissions:
  contents: read

jobs:
  check:
    if: github.event.head_commit.message == 'temporary journal requirement 13 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect tables
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re, html

          path=Path("word_output/2026.09.18v.docx")
          with ZipFile(path,"r") as z:
              xml=z.read("word/document.xml").decode("utf-8")

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          # Stream top-level body blocks in document order.
          body=re.search(r'<w:body>([\s\S]*?)</w:body>',xml).group(1)
          blocks=[]
          for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>|<w:tbl\b[\s\S]*?</w:tbl>',body):
              kind="tbl" if m.group(0).startswith("<w:tbl") else "p"
              blocks.append((kind,m.group(0),text_of(m.group(0))))

          table_num=0
          for idx,(kind,block,text) in enumerate(blocks):
              if kind=="tbl":
                  table_num+=1
                  print(f"TABLE[{table_num}] BLOCK_INDEX={idx}")
                  for j in range(max(0,idx-3),min(len(blocks),idx+3)):
                      k,b,t=blocks[j]
                      if t:
                          print(f"  NEAR[{j}] kind={k} text={t}")

                  tblpr=re.search(r'<w:tblPr\b[\s\S]*?</w:tblPr>',block)
                  print("  TBLPR="+(tblpr.group(0) if tblpr else "NONE"))

                  rows=re.findall(r'<w:tr\b[\s\S]*?</w:tr>',block)
                  print(f"  ROWS={len(rows)}")
                  for ri,row in enumerate(rows):
                      cells=re.findall(r'<w:tc\b[\s\S]*?</w:tc>',row)
                      vals=[text_of(c) for c in cells]
                      print(f"  ROW[{ri}]={vals}")
                      trpr=re.search(r'<w:trPr\b[\s\S]*?</w:trPr>',row)
                      if trpr:
                          print(f"    TRPR={trpr.group(0)}")
                      for ci,cell in enumerate(cells):
                          tcpr=re.search(r'<w:tcPr\b[\s\S]*?</w:tcPr>',cell)
                          if tcpr and "<w:tcBorders" in tcpr.group(0):
                              print(f"    CELL_BORDER[{ri},{ci}]={tcpr.group(0)}")

          # Caption formatting and prior mentions.
          paras=[m.group(0) for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml)]
          texts=[text_of(p) for p in paras]
          for i,(p,t) in enumerate(zip(paras,texts)):
              if re.match(r'^表\s*\d+',t):
                  mnum=re.match(r'^表\s*(\d+)',t); num=mnum.group(1)
                  centered=bool(re.search(r'<w:jc\b[^>]*w:val="center"[^>]*/>',p))
                  print(f"CAPTION[{i}] num={num} centered={centered} text={t}")
                  runs=[r for r in re.findall(r'<w:r\b[\s\S]*?</w:r>',p) if text_of(r)]
                  for k,r in enumerate(runs):
                      fm=re.search(r'<w:rFonts\b[^>]*/>',r)
                      sz=re.search(r'<w:sz\b[^>]*/>',r)
                      bold=bool(re.search(r'<w:b(?:\s[^>]*)?/>',r))
                      print(f"  RUN[{k}] text={text_of(r)} fonts={fm.group(0) if fm else None} size={sz.group(0) if sz else None} bold={bold}")
                  mentions=[(j,texts[j]) for j in range(i) if re.search(fr'表\s*{num}(?!\d)',texts[j])]
                  print(f"  PRIOR_MENTIONS={mentions[-3:]}")
          PY
