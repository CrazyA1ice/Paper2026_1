name: Inspect v5 figure2 context
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect_v5_fig2.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Figure 2 context
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          p="word_output/2026.09.20v5.docx"
          NS={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          body=root.find("w:body",NS)
          children=list(body)
          def txt(e):
              return "".join(x.text or "" for x in e.iter() if x.tag.endswith("}t"))
          for i,e in enumerate(children):
              if not e.tag.endswith("}p"): continue
              t=txt(e).strip()
              if "2.4 八随机种子" in t:
                  print("START",i)
                  for j in range(i,min(i+12,len(children))):
                      if children[j].tag.endswith("}p"):
                          print("P",j,txt(children[j]).strip())
                      elif children[j].tag.endswith("}tbl"):
                          print("TABLE",j)
                  break
          PY
