name: Integrate Changjiang 20261026 figures and text

on:
  push:
    branches: [main]
    paths:
      - 'paper_template/长江信息通信/integrate_20261026_figures_and_text.py'
      - '.github/workflows/czxxtx-integrate-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: czxxtx-20261026-figures
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install editing dependencies
        run: python -m pip install --disable-pip-version-check python-docx pillow
      - name: Integrate the three originals and preserved result text
        run: python "paper_template/长江信息通信/integrate_20261026_figures_and_text.py"
      - name: Verify resulting OOXML and image crops
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, zipfile
          from PIL import Image
          from docx import Document
          base=Path("paper_template/长江信息通信")
          docx=base/"自适应多尺度加权的多变量网络流量预测_czxxtx20261026_图文整合稿.docx"
          report=json.loads((base/"图2G图3H图4H_图文整合核验_20261026.json").read_text(encoding="utf-8"))
          assert report["after"]["required_values_in_corresponding_sections"]
          assert report["after"]["tables_unchanged"]
          d=Document(docx)
          assert len(d.inline_shapes)==4 and len(d.tables)==4
          with zipfile.ZipFile(docx) as z:
              assert z.testzip() is None
              media=[x for x in z.namelist() if x.startswith("word/media/")]
              assert len(media)>=7,media
          for rec in report["cropping"]:
              original=Image.open(base/"figure_previews_20261026"/rec["original"]).convert("RGB")
              clipped=Image.open(base/"figure_previews_20261026"/rec["new"]).convert("RGB")
              assert clipped.tobytes()==original.crop((0,0,clipped.width,clipped.height)).tobytes()
          print("Word integrity, tables, inline pictures, figure crop, and text checks PASS")
          PY
      - name: Commit finished manuscript and three cropped PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "paper_template/长江信息通信/自适应多尺度加权的多变量网络流量预测_czxxtx20261026_图文整合稿.docx" \
            "paper_template/长江信息通信/图2G图3H图4H_图文整合核验_20261026.json" \
            "paper_template/长江信息通信/figure_previews_20261026/fig2_G_compact_bars_no_table.png" \
            "paper_template/长江信息通信/figure_previews_20261026/fig3_H_grouped_bars_no_table.png" \
            "paper_template/长江信息通信/figure_previews_20261026/fig4_H_grouped_bars_no_table.png"
          git commit -m "Integrate original G/H/H no-table figures and retained statistics into Changjiang manuscript [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
