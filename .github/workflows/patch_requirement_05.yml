name: Temporary patch journal requirement 5

on:
  push:
    paths:
      - ".github/workflows/patch_requirement_05.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporary journal requirement 5 patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revise Chinese abstract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, html, shutil

          path=Path("word_output/2026.09.18v.docx")
          tmp=path.with_suffix(".tmp.docx")

          new_body="为提高骨干网络源—目的节点对流量短期预测对不同时间尺度变化的适应能力，构建一种基于样本级自适应多尺度加权的轻量预测方法。采用尺度1、2和4的非重叠平均池化生成多分辨率序列，并分别输入独立的分解线性模型进行预测；提取窗口均值、标准差、末时刻均值和平均绝对一阶差分，经路由网络生成Softmax权重，对不同尺度专家输出进行样本级自适应融合，并设置低频门控分析频率保留比例的影响。在Abilene数据集上的实验表明，无频域门控的自适应多尺度模型相较于单尺度分解线性模型，均方误差和平均绝对误差分别降低4.06%和10.52%；在尺度集合和专家结构相同条件下，均方误差较固定等权融合降低3.95%；随着频率保留比例增加，含门控模型误差逐步下降，但仍未优于无频域模型。实验结果说明，样本级尺度权重有助于提高骨干网络源—目的节点对短期流量预测精度，频域处理更适合作为频率特征分析的补充手段。"

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          def xml_escape(s):
              return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

          def replace_run_text(run,s):
              first=True
              def repl(m):
                  nonlocal first
                  attrs=m.group(1) or ""
                  if first:
                      first=False
                      return f'<w:t{attrs}>{xml_escape(s)}</w:t>'
                  return f'<w:t{attrs}></w:t>'
              return re.sub(r'<w:t(\s[^>]*)?>([\s\S]*?)</w:t>',repl,run)

          with ZipFile(path,"r") as zin:
              xml=zin.read("word/document.xml").decode("utf-8")
              target=None
              for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml):
                  if text_of(m.group(0)).startswith("摘要："):
                      target=m
                      break
              if target is None:
                  raise RuntimeError("Chinese abstract paragraph not found")

              p=target.group(0)
              runs=list(re.finditer(r'<w:r\b[\s\S]*?</w:r>',p))
              out=[]
              pos=0
              body_written=False
              for rm in runs:
                  out.append(p[pos:rm.start()])
                  run=rm.group(0)
                  rt=text_of(run)
                  if rt=="摘要：":
                      pass
                  elif rt and not body_written:
                      run=replace_run_text(run,new_body)
                      body_written=True
                  elif rt:
                      run=replace_run_text(run,"")
                  out.append(run)
                  pos=rm.end()
              out.append(p[pos:])
              newp=''.join(out)
              if not body_written:
                  raise RuntimeError("abstract body run not found")

              body=text_of(newp)[len("摘要："):]
              count=len(re.sub(r'\s+','',body))
              forbidden=[w for w in ["本文","我们","作者","笔者"] if w in body]
              if not (300 <= count <= 400):
                  raise RuntimeError(f"abstract length out of range: {count}")
              if forbidden:
                  raise RuntimeError(f"forbidden first-person terms: {forbidden}")
              if "DLinear" in body:
                  raise RuntimeError("unexplained DLinear remains in Chinese abstract")
              for marker in ["构建一种","采用尺度","实验表明","实验结果说明"]:
                  if marker not in body:
                      raise RuntimeError(f"four-element marker missing: {marker}")

              xml=xml[:target.start()]+newp+xml[target.end():]
              with ZipFile(tmp,"w",ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      data=xml.encode("utf-8") if item.filename=="word/document.xml" else zin.read(item.filename)
                      zout.writestr(item,data)

          shutil.move(tmp,path)
          print(f"ABSTRACT_LENGTH={count}")
          print("STATUS=FIXED")
          PY

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fc-cache -fv >/dev/null

      - name: Render for QA
        shell: bash
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          pdfinfo qa_render/2026.09.18v.pdf | grep -E 'Pages|Page size'

      - uses: actions/upload-artifact@v4
        with:
          name: journal-requirement-05-qa
          path: qa_render/
          if-no-files-found: error

      - name: Commit manuscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.18v.docx
          git diff --cached --quiet && exit 1
          git commit -m "apply journal requirement 5 abstract"
          git push
