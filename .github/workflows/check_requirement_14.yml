name: Temporary check journal requirement 14

on:
  push:
    paths:
      - ".github/workflows/check_requirement_14.yml"

permissions:
  contents: read

jobs:
  check:
    if: github.event.head_commit.message == 'temporary journal requirement 14 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect equations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re, html

          path=Path("word_output/2026.09.18v.docx")
          with ZipFile(path,"r") as z:
              xml=z.read("word/document.xml").decode("utf-8")

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              vals += re.findall(r'<m:t>([\s\S]*?)</m:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          paras=[m.group(0) for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml)]
          texts=[text_of(p) for p in paras]

          eqs=[]
          for i,p in enumerate(paras):
              if "<m:oMath" in p or "<m:oMathPara" in p:
                  eqs.append((i,p,texts[i]))
                  ppr=re.search(r'<w:pPr\b[^>]*>[\s\S]*?</w:pPr>',p)
                  jc=re.search(r'<w:jc\b[^>]*w:val="([^"]+)"',p)
                  tabs=re.findall(r'<w:tab w:val="([^"]+)" w:pos="([^"]+)"',p)
                  print(f"EQ[{len(eqs)}] P[{i}] text={texts[i]}")
                  print(f"  OMML=True jc={jc.group(1) if jc else None} tabs={tabs}")
                  print("  PPR="+(ppr.group(0) if ppr else "NONE"))
                  seq=[]
                  for node in re.finditer(r'<w:tab/>|<w:t(?:\\s[^>]*)?>[\\s\\S]*?</w:t>|<m:oMath\\b[\\s\\S]*?</m:oMath>',p):
                      s=node.group(0)
                      if s=="<w:tab/>":
                          seq.append("TAB")
                      elif s.startswith("<m:oMath"):
                          seq.append("MATH:"+text_of(s))
                      else:
                          seq.append("TEXT:"+text_of(s))
                  print("  SEQ="+repr(seq))
                  for j in range(max(0,i-2),min(len(paras),i+4)):
                      if texts[j]:
                          print(f"  NEAR[{j}]={texts[j]}")

          print("EQUATION_COUNT="+str(len(eqs)))

          # Check positional order of tabs, math object, and equation number.
          for idx in [21,37,54,62,69]:
              p=paras[idx]
              tabs=[m.start() for m in re.finditer(r'<w:tab\s*/>',p)]
              math_pos=min([x for x in [p.find("<m:oMath"),p.find("<m:oMathPara")] if x>=0], default=-1)
              num_match=re.search(r'<w:t(?:\s[^>]*)?>\((\d+)\)</w:t>',p)
              num_pos=num_match.start() if num_match else -1
              print(f"POS[{idx}] tabs={tabs} math={math_pos} num={num_pos}")

          # Paragraphs that look like standalone equation numbers.
          for i,t in enumerate(texts):
              if re.fullmatch(r'\(\d+\)',t):
                  p=paras[i]
                  jc=re.search(r'<w:jc\b[^>]*w:val="([^"]+)"',p)
                  print(f"EQNUM_ONLY[{i}]={t} jc={jc.group(1) if jc else None}")

          # Potential multi-letter variable-like tokens inside equations.
          for n,(i,p,t) in enumerate(eqs,1):
              omt=' '.join(html.unescape(x) for x in re.findall(r'<m:t>([\s\S]*?)</m:t>',p))
              tokens=re.findall(r'(?<![A-Za-z])[A-Za-z]{2,}(?![A-Za-z])',omt)
              print(f"EQ_TOKENS[{n}]={tokens} RAW={omt}")

          # Check all explicit references to equations in prose.
          for i,t in enumerate(texts):
              if re.search(r'式\s*[（(]\d+[）)]|公式\s*\d+',t):
                  print(f"EQ_REF[{i}]={t}")
          PY
