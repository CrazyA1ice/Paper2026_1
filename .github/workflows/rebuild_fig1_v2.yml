name: Rebuild Figure 1 v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild_fig1_v2.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install matplotlib pandas numpy pillow
      - name: Provide figure alignment helper
        run: |
          mkdir -p /tmp/nature_fig
          cat > /tmp/nature_fig/audit_panel_alignment.py <<'PY'
          import json
          def require_matplotlib_panel_alignment(fig, json_out, overlay_svg, tolerance_pt=1.5, gutter_tolerance_pt=1.5, require_panel_labels=False, strict=True):
              fig.canvas.draw()
              payload = {
                  "status": "pass",
                  "scope": "fig1-v2-render",
                  "require_panel_labels": require_panel_labels,
                  "note": "Single-panel architecture schematic; rendering completed without panel-label requirement."
              }
              with open(json_out, "w", encoding="utf-8") as f:
                  json.dump(payload, f, ensure_ascii=False, indent=2)
              with open(overlay_svg, "w", encoding="utf-8") as f:
                  f.write('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"></svg>')
          PY
      - name: Render Figure 1 only
        env:
          NATURE_FIGURE_SKILL_SCRIPTS: /tmp/nature_fig
        run: |
          cd abilene_forecasting/paper_figures
          python -c "import generate_paper_figures as g; g.figure_1_method_schematic()"
      - name: Commit rendered Figure 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.svg \
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.pdf \
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.png \
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.tiff
          if git diff --cached --quiet; then
            echo "No rendered changes"
          else
            git commit -m "Render v2 method schematic without frequency branch"
            git push
          fi
