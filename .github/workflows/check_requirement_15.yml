name: Temporary check journal requirement 15

on:
  push:
    paths:
      - ".github/workflows/check_requirement_15.yml"

permissions:
  contents: read

jobs:
  check:
    if: github.event.head_commit.message == 'temporary journal requirement 15 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect quantity and unit typography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re, html

          path=Path("word_output/2026.09.18v.docx")
          with ZipFile(path,"r") as z:
              xml=z.read("word/document.xml").decode("utf-8")

          def wt(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              vals += re.findall(r'<m:t>([\s\S]*?)</m:t>',x)
              return ''.join(html.unescape(v) for v in vals)

          # Inspect all math runs containing important symbols/functions.
          for i,m in enumerate(re.finditer(r'<m:r\b[\s\S]*?</m:r>',xml)):
              r=m.group(0); t=wt(r)
              if not t: continue
              if any(k in t for k in ["X","Y","W","T","R","F","K","z","a","b","μ","σ","α","log","exp","max","sigmoid","ReLU","L","H","C","N","r","s","k","j"]):
                  sty=re.search(r'<m:sty\b[^>]*m:val="([^"]+)"[^>]*/>',r)
                  nor=bool(re.search(r'<m:nor\b[^>]*/>',r))
                  bold=bool(re.search(r'<w:b(?:\s[^>]*)?/>',r))
                  italic=bool(re.search(r'<w:i(?:\s[^>]*)?/>',r))
                  print(f"MRUN[{i}] text={t!r} sty={sty.group(1) if sty else None} nor={nor} bold={bold} italic={italic} xml={r[:350]}")

          # Inspect prose for units and their run properties.
          paras=[m.group(0) for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml)]
          for pi,p in enumerate(paras):
              txt=wt(p)
              if any(u in txt for u in ["1 h","6 GB","24 h","0.001","6∶2∶2","600 dpi"]):
                  print(f"UNIT_P[{pi}]={txt}")
                  for ri,r in enumerate(re.findall(r'<w:r\b[\s\S]*?</w:r>',p)):
                      rt=wt(r)
                      if rt:
                          bold=bool(re.search(r'<w:b(?:\s[^>]*)?/>',r))
                          italic=bool(re.search(r'<w:i(?:\s[^>]*)?/>',r))
                          print(f"  RUN[{ri}] text={rt!r} bold={bold} italic={italic}")
          PY
