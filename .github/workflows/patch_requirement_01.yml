name: Temporary patch journal requirement 1

on:
  push:
    paths:
      - ".github/workflows/patch_requirement_01.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporary journal requirement 1 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply page and default text settings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, shutil

          path = Path("word_output/2026.09.18v.docx")
          tmp = path.with_suffix(".tmp.docx")

          # OOXML twips: 1 cm = 567 twips approximately
          TOP = "1757"     # 3.1 cm
          BOTTOM = "1417"  # 2.5 cm
          LEFT = "1134"    # 2.0 cm
          RIGHT = "1134"   # 2.0 cm

          with ZipFile(path, "r") as zin:
              doc = zin.read("word/document.xml").decode("utf-8")
              styles = zin.read("word/styles.xml").decode("utf-8")

              # 1) Section page margins + portrait + single column.
              def patch_sect(m):
                  sect = m.group(0)

                  if re.search(r'<w:pgMar\b[^>]*/>', sect):
                      sect = re.sub(
                          r'<w:pgMar\b[^>]*/>',
                          f'<w:pgMar w:top="{TOP}" w:right="{RIGHT}" w:bottom="{BOTTOM}" w:left="{LEFT}" w:header="851" w:footer="992" w:gutter="0"/>',
                          sect,
                          count=1
                      )
                  else:
                      sect = sect.replace('</w:sectPr>', f'<w:pgMar w:top="{TOP}" w:right="{RIGHT}" w:bottom="{BOTTOM}" w:left="{LEFT}" w:header="851" w:footer="992" w:gutter="0"/></w:sectPr>')

                  # Portrait: remove landscape orientation while preserving page size.
                  sect = re.sub(
                      r'<w:pgSz\b([^>]*)w:orient="landscape"([^>]*)/>',
                      lambda x: '<w:pgSz' + x.group(1) + x.group(2) + '/>',
                      sect
                  )

                  # Single column.
                  if re.search(r'<w:cols\b[^>]*/>', sect):
                      sect = re.sub(r'<w:cols\b[^>]*/>', '<w:cols w:space="425" w:num="1"/>', sect, count=1)
                  else:
                      sect = sect.replace('</w:sectPr>', '<w:cols w:space="425" w:num="1"/></w:sectPr>')
                  return sect

              doc, sect_count = re.subn(r'<w:sectPr\b[\s\S]*?</w:sectPr>', patch_sect, doc)
              if sect_count < 1:
                  raise RuntimeError("no section properties found")

              # 2) Set document default East Asian font to SimSun (宋体).
              if '<w:docDefaults>' in styles:
                  if re.search(r'<w:rFonts\b[^>]*/>', styles):
                      # Patch the first default rFonts only.
                      def font_repl(m):
                          tag = m.group(0)
                          if 'w:eastAsia=' in tag:
                              tag = re.sub(r'w:eastAsia="[^"]*"', 'w:eastAsia="宋体"', tag)
                          else:
                              tag = tag[:-2] + ' w:eastAsia="宋体"/>'
                          return tag
                      styles = re.sub(r'<w:rFonts\b[^>]*/>', font_repl, styles, count=1)
                  else:
                      styles = styles.replace('<w:rPrDefault><w:rPr>', '<w:rPrDefault><w:rPr><w:rFonts w:eastAsia="宋体"/>', 1)

              # 3) Single line spacing. Normalize every explicit spacing tag.
              def force_single_spacing(xml):
                  def repl(m):
                      tag = m.group(0)
                      if 'w:line=' in tag:
                          tag = re.sub(r'w:line="[^"]*"', 'w:line="240"', tag)
                      else:
                          tag = tag[:-2] + ' w:line="240"/>'
                      if 'w:lineRule=' in tag:
                          tag = re.sub(r'w:lineRule="[^"]*"', 'w:lineRule="auto"', tag)
                      else:
                          tag = tag[:-2] + ' w:lineRule="auto"/>'
                      return tag
                  return re.sub(r'<w:spacing\\b[^>]*/>', repl, xml)

              doc = force_single_spacing(doc)
              styles = force_single_spacing(styles)

              # Ensure paragraph defaults also carry single line spacing for
              # paragraphs/styles without an explicit spacing element.
              pdef = re.search(r'<w:pPrDefault>[\\s\\S]*?</w:pPrDefault>', styles)
              if pdef:
                  block0 = pdef.group(0)
                  if not re.search(r'<w:spacing\\b[^>]*/>', block0):
                      if re.search(r'<w:pPr\\b[^>]*>', block0):
                          block0 = re.sub(
                              r'(<w:pPr\\b[^>]*>)',
                              r'\\1<w:spacing w:line="240" w:lineRule="auto"/>',
                              block0,
                              count=1
                          )
                      else:
                          block0 = block0.replace(
                              '<w:pPrDefault>',
                              '<w:pPrDefault><w:pPr><w:spacing w:line="240" w:lineRule="auto"/></w:pPr>',
                              1
                          )
                      styles = styles[:pdef.start()] + block0 + styles[pdef.end():]
              else:
                  if '<w:docDefaults>' in styles:
                      styles = styles.replace(
                          '<w:docDefaults>',
                          '<w:docDefaults><w:pPrDefault><w:pPr><w:spacing w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault>',
                          1
                      )
                  else:
                      raise RuntimeError("docDefaults not found")

              # Structural checks.
              if f'w:top="{TOP}"' not in doc or f'w:bottom="{BOTTOM}"' not in doc or f'w:left="{LEFT}"' not in doc or f'w:right="{RIGHT}"' not in doc:
                  raise RuntimeError("margin patch failed")
              if 'w:num="1"' not in doc:
                  raise RuntimeError("single-column patch failed")
              if 'w:eastAsia="宋体"' not in styles:
                  raise RuntimeError("default SimSun patch failed")
              if 'w:line="240"' not in styles:
                  raise RuntimeError("single spacing patch failed")

              with ZipFile(tmp, "w", ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename == "word/document.xml":
                          data = doc.encode("utf-8")
                      elif item.filename == "word/styles.xml":
                          data = styles.encode("utf-8")
                      else:
                          data = zin.read(item.filename)
                      zout.writestr(item, data)

          shutil.move(tmp, path)
          print("requirement 1 applied")
          PY

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fc-cache -fv >/dev/null

      - name: Render modified DOCX for QA
        shell: bash
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          pdfinfo qa_render/2026.09.18v.pdf | grep -E 'Pages|Page size'
          ls -lh qa_render

      - uses: actions/upload-artifact@v4
        with:
          name: journal-requirement-01-qa
          path: qa_render/
          if-no-files-found: error

      - name: Commit manuscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.18v.docx
          git diff --cached --quiet && exit 1
          git commit -m "apply journal requirement 1 page layout"
          git push
