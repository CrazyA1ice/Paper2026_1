name: Build v14 external baseline figure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_v14_external_baseline.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-liberation libreoffice-writer poppler-utils
          python -m pip install --upgrade pip
          python -m pip install matplotlib pandas numpy pillow python-docx

      - name: Generate Figure 2 from real seed42-44 results
        run: |
          python abilene_forecasting/paper_figures/generate_external_baseline_effect_v13.py
          test -s abilene_forecasting/paper_figures/exports/color/fig2_external_baseline_reduction_color.png
          test -s abilene_forecasting/paper_figures/exports/grayscale/fig2_external_baseline_reduction_grayscale.png
          test -s abilene_forecasting/paper_figures/source_data_v13/fig2_external_baseline_reduction_3seeds.csv

      - name: Create v14 manuscript from v13
        run: |
          python word_output/add_external_baseline_effect_v14.py

      - name: Verify manuscript structure and source statistics
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          import pandas as pd

          csv="abilene_forecasting/paper_figures/source_data_v13/fig2_external_baseline_reduction_3seeds.csv"
          df=pd.read_csv(csv)
          checks=[
              ("abilene","MSE","dlinear",3,4.06),
              ("abilene","MAE","dlinear",3,10.52),
              ("abilene","MSE","lightts",3,29.89),
              ("abilene","MAE","lightts",3,17.65),
              ("geant","MSE","dlinear",2,4.43),
              ("geant","MAE","dlinear",2,3.46),
              ("geant","MSE","lightts",3,46.83),
              ("geant","MAE","lightts",3,29.29),
          ]
          for dataset,metric,baseline,wins,agg in checks:
              sub=df[(df.dataset==dataset)&(df.metric==metric)&(df.baseline==baseline)]
              assert len(sub)==3
              got_wins=int(sub.adaptive_better.sum())
              got_agg=float(sub.aggregate_reduction_from_3seed_means_pct.iloc[0])
              print(dataset,metric,baseline,"wins",got_wins,"aggregate",got_agg)
              assert got_wins==wins
              assert abs(got_agg-agg)<0.02

          p="word_output/2026.09.21v14.docx"
          NS={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          text="".join(e.text or "" for e in root.iter() if e.tag.endswith("}t"))
          assert "2.6 代表性窗口预测结果" not in text
          assert "代表性窗口" not in text
          assert "图2 本文方法相对DLinear和LightTS的三随机种子误差降低率" in text
          assert "图3 固定等权与自适应权重的八随机种子配对MSE及配对差值分布" in text
          assert "图4 八随机种子下样本级自适应路由权重分布" in text
          assert "图5 两数据集样本级路由权重变化" in text
          PY

      - name: Render full v14 manuscript
        run: |
          rm -rf word_output/render_v14_word
          mkdir -p word_output/render_v14_word
          libreoffice --headless --convert-to pdf --outdir word_output/render_v14_word word_output/2026.09.21v14.docx
          pdftoppm -png -r 170 word_output/render_v14_word/2026.09.21v14.pdf word_output/render_v14_word/page
          ls -lh word_output/render_v14_word

      - name: Commit v14 and figure assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            word_output/2026.09.21v14.docx \
            word_output/render_v14_word/ \
            abilene_forecasting/paper_figures/exports/color/fig2_external_baseline_reduction_color.png \
            abilene_forecasting/paper_figures/exports/color/fig2_external_baseline_reduction_color.jpg \
            abilene_forecasting/paper_figures/exports/color/fig2_external_baseline_reduction_color.pdf \
            abilene_forecasting/paper_figures/exports/color/fig2_external_baseline_reduction_color.svg \
            abilene_forecasting/paper_figures/exports/grayscale/fig2_external_baseline_reduction_grayscale.png \
            abilene_forecasting/paper_figures/exports/grayscale/fig2_external_baseline_reduction_grayscale.jpg \
            abilene_forecasting/paper_figures/exports/grayscale/fig2_external_baseline_reduction_grayscale.tiff \
            abilene_forecasting/paper_figures/source_data_v13/fig2_external_baseline_reduction_3seeds.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add external-baseline effect figure and remove weak prediction case"
            git push
          fi

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: v14-external-baseline-qa
          path: |
            word_output/2026.09.21v14.docx
            word_output/render_v14_word/2026.09.21v14.pdf
            word_output/render_v14_word/page-*.png
            abilene_forecasting/paper_figures/exports/color/fig2_external_baseline_reduction_color.png
            abilene_forecasting/paper_figures/exports/grayscale/fig2_external_baseline_reduction_grayscale.png
          retention-days: 2
