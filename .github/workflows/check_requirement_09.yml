name: Temporary check journal requirement 9

on:
  push:
    paths:
      - ".github/workflows/check_requirement_09.yml"

permissions:
  contents: read

jobs:
  check:
    if: github.event.head_commit.message == 'temporary journal requirement 9 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect English abstract and keywords
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re, html

          path=Path("word_output/2026.09.18v.docx")
          with ZipFile(path,"r") as z:
              xml=z.read("word/document.xml").decode("utf-8")

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          paras=[text_of(m.group(0)) for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml)]
          abstract=next(t for t in paras if t.startswith("Abstract:"))
          keywords=next(t for t in paras if t.startswith("Key words:"))
          zhkw=next(t for t in paras if t.startswith("关键词："))

          body=abstract[len("Abstract:"):].strip()
          kbody=keywords[len("Key words:"):].strip()
          zhbody=zhkw[len("关键词："):].strip()

          forbidden=[w for w in [" we "," our "," us ","I "," my "," the authors "," this paper "] if w.lower() in (" "+body.lower()+" ")]
          past_markers=["was developed","was used","were separately processed","were extracted","was also introduced","showed","was reduced"]
          present_markers=["The results show","can serve"]
          past_ok=all(x in body for x in past_markers)
          present_ok=all(x in body for x in present_markers)
          third_person_ok=(len(forbidden)==0)

          en_items=[x.strip() for x in kbody.split(";") if x.strip()]
          zh_items=[x.strip() for x in zhbody.split("；") if x.strip()]
          lowercase_ok=all(x == x.lower() for x in en_items)
          count_match=(len(en_items)==len(zh_items))

          expected=[
            "network traffic forecasting",
            "multivariate time series",
            "multiscale learning",
            "adaptive weighting",
            "linear decomposition forecasting",
            "frequency-domain analysis"
          ]
          correspondence_ok=(en_items==expected)

          print("ABSTRACT="+abstract)
          print("KEYWORDS="+keywords)
          print("ZH_KEYWORDS="+zhkw)
          print("FORBIDDEN="+(",".join(forbidden) if forbidden else "NONE"))
          print(f"CHECK third_person_ok={third_person_ok} past_ok={past_ok} present_ok={present_ok}")
          print(f"KW count_match={count_match} lowercase_ok={lowercase_ok} correspondence_ok={correspondence_ok} count={len(en_items)}")
          overall=third_person_ok and past_ok and present_ok and count_match and lowercase_ok and correspondence_ok
          print("STATUS="+("COMPLIANT" if overall else "NOT_COMPLIANT"))
          PY
