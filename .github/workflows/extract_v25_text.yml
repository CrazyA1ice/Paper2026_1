name: Extract v25 text for audit

on:
  push:
    branches: [main]
    paths:
      - 'word_output/extract_v25_text.py'
      - '.github/workflows/extract_v25_text.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install python-docx
      - run: python word_output/extract_v25_text.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/v25_text_dump.txt
          git commit -m "Extract v25 text for AI-writing audit" || exit 0
          git push
