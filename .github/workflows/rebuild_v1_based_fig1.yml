name: Rebuild v1-based Figure 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild_v1_based_fig1.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering tools
        run: |
          python -m pip install pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libreoffice-writer poppler-utils
      - name: Generate Figure 1 from v1 original
        run: |
          python abilene_forecasting/paper_figures/generate_fig1_from_v1.py
      - name: Replace Figure 1 in v2 manuscript
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED, ZipInfo
          import xml.etree.ElementTree as ET

          source = Path("word_output/2026.09.19v2.docx")
          temp = Path("word_output/2026.09.19v2.tmp.docx")
          figure = Path("abilene_forecasting/paper_figures/exports/fig1_method_schematic.png")

          NS = {
              "w": "http://schemas.openxmlformats.org/wordprocessingml/2006/main",
              "a": "http://schemas.openxmlformats.org/drawingml/2006/main",
              "r": "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
              "pr": "http://schemas.openxmlformats.org/package/2006/relationships",
          }

          def ptext(p):
              return "".join(e.text or "" for e in p.iter() if e.tag.endswith("}t"))

          def clone_info(info):
              copied = ZipInfo(info.filename, info.date_time)
              copied.compress_type = ZIP_DEFLATED
              copied.comment = info.comment
              copied.extra = info.extra
              copied.create_system = info.create_system
              copied.external_attr = info.external_attr
              copied.internal_attr = info.internal_attr
              copied.flag_bits = info.flag_bits
              return copied

          with ZipFile(source, "r") as zin:
              document = ET.fromstring(zin.read("word/document.xml"))
              relationships = ET.fromstring(zin.read("word/_rels/document.xml.rels"))
              body = document.find("w:body", NS)
              paragraphs = body.findall("w:p", NS)

              caption_index = next(
                  i for i, p in enumerate(paragraphs)
                  if ptext(p).strip() == "图1 自适应多尺度预测框架"
              )
              figure_paragraph = None
              for i in range(caption_index - 1, max(-1, caption_index - 5), -1):
                  if any(e.tag.endswith("}blip") for e in paragraphs[i].iter()):
                      figure_paragraph = paragraphs[i]
                      break
              if figure_paragraph is None:
                  raise RuntimeError("Figure 1 drawing paragraph not found in v2")

              blip = next(
                  e for e in figure_paragraph.iter() if e.tag.endswith("}blip")
              )
              rid = blip.get("{" + NS["r"] + "}embed")
              relationship = next(e for e in relationships if e.get("Id") == rid)
              media_name = "word/" + relationship.get("Target")

              figure_bytes = figure.read_bytes()
              with ZipFile(temp, "w", ZIP_DEFLATED) as zout:
                  for info in zin.infolist():
                      payload = (
                          figure_bytes
                          if info.filename == media_name
                          else zin.read(info.filename)
                      )
                      zout.writestr(clone_info(info), payload)

          temp.replace(source)
          print("updated", source)
          PY
      - name: Render v2 manuscript for QA
        run: |
          rm -rf qa_v1_based_fig1
          mkdir -p qa_v1_based_fig1
          libreoffice --headless --convert-to pdf --outdir qa_v1_based_fig1 word_output/2026.09.19v2.docx
          pdftoppm -f 1 -singlefile -png -r 160 qa_v1_based_fig1/2026.09.19v2.pdf qa_v1_based_fig1/page1
          pdftoppm -f 2 -singlefile -png -r 160 qa_v1_based_fig1/2026.09.19v2.pdf qa_v1_based_fig1/page2
          pdftoppm -f 3 -singlefile -png -r 160 qa_v1_based_fig1/2026.09.19v2.pdf qa_v1_based_fig1/page3
      - uses: actions/upload-artifact@v4
        with:
          name: v1-based-fig1-qa
          path: |
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.png
            word_output/2026.09.19v2.docx
            qa_v1_based_fig1/2026.09.19v2.pdf
            qa_v1_based_fig1/page*.png
          retention-days: 2
      - name: Commit revised Figure 1 and v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.png \
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.pdf \
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.svg \
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.tiff \
            word_output/2026.09.19v2.docx
          git commit -m "Restore Figure 1 to v1-based layout without frequency gates" || exit 0
          git push
