name: Insert router distribution Figure 3 into v5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/insert_router_distribution_fig3_v5.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install document dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-liberation libreoffice-writer poppler-utils
          python -m pip install --upgrade pip
          python -m pip install python-docx

      - name: Insert Figure 3 and update Section 2.5
        run: |
          python word_output/insert_router_distribution_fig3_v5.py

      - name: Structural verification
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          p="word_output/2026.09.20v5.docx"
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          text="\n".join(
              "".join(x.text or "" for x in e.iter() if x.tag.endswith("}t"))
              for e in root.iter() if e.tag.endswith("}p")
          )
          assert "图3 八随机种子下样本级自适应路由权重分布" in text
          assert "图4 两数据集样本级路由权重变化" in text
          assert "图2—图4" in text
          assert "Abilene的α1、α2和α4分别为0.257、0.319和0.424" in text
          assert "GÉANT分别为0.283、0.318和0.399" in text
          inline=sum(1 for e in root.iter() if e.tag.endswith("}inline"))
          print("inline figures:",inline)
          assert inline==4
          PY

      - name: Render full manuscript for QA
        run: |
          rm -rf qa_fig3_router_distribution_v5
          mkdir -p qa_fig3_router_distribution_v5
          libreoffice --headless --convert-to pdf --outdir qa_fig3_router_distribution_v5 word_output/2026.09.20v5.docx
          pdftoppm -png -r 170 qa_fig3_router_distribution_v5/2026.09.20v5.pdf qa_fig3_router_distribution_v5/page
          ls -lh qa_fig3_router_distribution_v5

      - name: Commit v5 and formal Figure 3 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            word_output/2026.09.20v5.docx \
            abilene_forecasting/paper_figures/exports/color/fig3_router_weight_distribution_color.png \
            abilene_forecasting/paper_figures/exports/color/fig3_router_weight_distribution_color.jpg \
            abilene_forecasting/paper_figures/exports/color/fig3_router_weight_distribution_color.pdf \
            abilene_forecasting/paper_figures/exports/color/fig3_router_weight_distribution_color.svg \
            abilene_forecasting/paper_figures/exports/grayscale/fig3_router_weight_distribution_grayscale.png \
            abilene_forecasting/paper_figures/exports/grayscale/fig3_router_weight_distribution_grayscale.jpg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Insert router weight distribution as Figure 3 in v5"
            git push
          fi

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fig3-router-distribution-v5-qa
          path: |
            word_output/2026.09.20v5.docx
            qa_fig3_router_distribution_v5/2026.09.20v5.pdf
            qa_fig3_router_distribution_v5/page-*.png
            abilene_forecasting/paper_figures/exports/color/fig3_router_weight_distribution_color.png
            abilene_forecasting/paper_figures/exports/grayscale/fig3_router_weight_distribution_grayscale.png
          retention-days: 2
