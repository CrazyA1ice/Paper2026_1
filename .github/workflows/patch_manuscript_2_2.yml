name: Temporary patch manuscript section 2.2

on:
  push:
    paths:
      - ".github/workflows/patch_manuscript_2_2.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporary manuscript patch 2.2 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current DOCX in place
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, shutil, tempfile, html

          path = Path("word_output/2026.09.18v.docx")
          tmp = path.with_suffix(".tmp.docx")

          def para_text(pxml: str) -> str:
              vals = re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>', pxml)
              return re.sub(r'\s+', ' ', ''.join(html.unescape(v) for v in vals)).strip()

          def xml_escape(s: str) -> str:
              return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          def replace_para_text(pxml: str, new_text: str) -> str:
              first = True
              def repl(m):
                  nonlocal first
                  attrs = m.group(1) or ""
                  if first:
                      first = False
                      return f'<w:t{attrs}>{xml_escape(new_text)}</w:t>'
                  return f'<w:t{attrs}></w:t>'
              return re.sub(r'<w:t(\s[^>]*)?>([\s\S]*?)</w:t>', repl, pxml)

          with ZipFile(path, "r") as zin:
              xml = zin.read("word/document.xml").decode("utf-8")

              replacements = {
                  "2.3 基础模型与组件消融": "2.2 基础模型对比与组件分析",
                  "表1比较五种基础配置。所有模型使用相同划分、输入输出长度、预处理和早停规则。DLinear+自适应多尺度取得最低平均误差，MSE为0.186099，较单尺度DLinear降低4.06%；MAE为0.168203，降低10.52%。这表明三种分辨率与样本级融合的组合能够为当前Abilene短期预测提供互补信息。随机种子分布及均值见图2。":
                  "表1给出不同基础模型及组件组合的预测结果。所有模型采用相同的数据划分、输入输出长度、预处理方式和早停策略。DLinear+自适应多尺度取得最低平均误差，MSE和MAE分别为0.186099和0.168203；与单尺度DLinear相比，MSE降低4.06%，MAE降低10.52%。说明在当前Abilene任务中，不同时间分辨率的尺度专家与样本级自适应融合能够形成互补预测，并有效降低整体误差。各模型在3个随机种子下的结果分布及均值见图2。",
                  "频域相关模型没有呈现同等收益。FITS和DLinear+频域门控的MSE分别比DLinear高4.25%和1.65%；在自适应多尺度模型上增加r=0.50的频域门控后，MSE由0.186099升至0.192432。完整模型仍比DLinear低0.80%，但该差异不能证明频域模块单独有效。由表1和图2可见，基础实验中的主要增益来自自适应多尺度，不来自低频门控。":
                  "频域相关配置未表现出与自适应多尺度相同的增益。FITS和DLinear+频域门控的MSE分别比DLinear高4.25%和1.65%；在自适应多尺度模型上加入r=0.50的频域门控后，MSE由0.186099升至0.192432，虽仍低于DLinear，但没有超过无频域自适应多尺度模型。由此可见，当前基础实验中的主要性能改善来自多尺度专家与自适应融合，而非低频门控。频域门控的作用将在后续频率保留比例敏感性实验中进一步分析。"
              }

              seen = {k: 0 for k in replacements}
              parts, pos = [], 0
              for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>', xml):
                  parts.append(xml[pos:m.start()])
                  p = m.group(0)
                  t = para_text(p)
                  if t in replacements:
                      seen[t] += 1
                      p = replace_para_text(p, replacements[t])
                  parts.append(p)
                  pos = m.end()
              parts.append(xml[pos:])
              new_xml = ''.join(parts)

              missing = {k:v for k,v in seen.items() if v != 1}
              if missing:
                  raise RuntimeError(f"target paragraph match failure: {missing}")

              # Guardrails: table/figure captions and neighboring next-section heading must remain.
              for required in [
                  "表1 基础模型消融结果",
                  "图2 基础模型消融结果",
                  "2.4 自适应权重消融与路由行为"
              ]:
                  if required not in ''.join(para_text(p) for p in re.findall(r'<w:p\b[\s\S]*?</w:p>', new_xml)):
                      raise RuntimeError(f"required neighboring content missing: {required}")

              with ZipFile(tmp, "w", ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      data = new_xml.encode("utf-8") if item.filename == "word/document.xml" else zin.read(item.filename)
                      zout.writestr(item, data)

          shutil.move(tmp, path)
          print("patched", path)
          PY

      - name: Commit patched manuscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.18v.docx
          git diff --cached --quiet && exit 1
          git commit -m "revise section 2.2 base model comparison"
          git push
