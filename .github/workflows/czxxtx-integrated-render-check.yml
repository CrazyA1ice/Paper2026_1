name: Render and inspect Changjiang integrated manuscript

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/czxxtx-integrated-render-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Word rendering and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk >/dev/null
          python -m pip install --disable-pip-version-check pillow python-docx
      - name: Render whole manuscript
        run: |
          set -euo pipefail
          f="paper_template/长江信息通信/自适应多尺度加权的多变量网络流量预测_czxxtx20261026_图文整合稿.docx"
          test -s "$f"
          mkdir -p /tmp/czxxtx_render
          libreoffice -env:UserInstallation=file:///tmp/lo_czxxtx_qa --headless --convert-to pdf --outdir /tmp/czxxtx_render "$f"
          pdf=$(find /tmp/czxxtx_render -maxdepth 1 -name '*.pdf' -print -quit)
          test -s "$pdf"
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import importlib.util
          src=Path("paper_template/长江信息通信/自适应多尺度加权的多变量网络流量预测_czxxtx20261026_结构精简稿.docx")
          script=Path("paper_template/长江信息通信/integrate_20261026_figures_and_text.py")
          spec=importlib.util.spec_from_file_location("integration",script)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          mod.make_exact_crops()
          d=Document(src);d.save("/tmp/czxxtx_render/roundtrip.docx")
          d=Document(src);mod.insert_missing_facts(d);d.save("/tmp/czxxtx_render/text_only.docx")
          d=Document(src);mod.replace_figures(d);d.save("/tmp/czxxtx_render/images_only.docx")
          PY
          for variant in roundtrip text_only images_only; do
            libreoffice -env:UserInstallation=file:///tmp/lo_czxxtx_qa --headless --convert-to pdf --outdir /tmp/czxxtx_render "/tmp/czxxtx_render/$variant.docx"
            pdfinfo "/tmp/czxxtx_render/$variant.pdf" | awk -v n="$variant" '/^Pages:/ {print "DIAGNOSTIC "n" pages="$2}'
            pdftotext "/tmp/czxxtx_render/$variant.pdf" - | grep -c "参考文献" | xargs echo "DIAGNOSTIC $variant reference_hits=" || true
          done
          source_doc="paper_template/长江信息通信/自适应多尺度加权的多变量网络流量预测_czxxtx20261026_结构精简稿.docx"
          libreoffice -env:UserInstallation=file:///tmp/lo_czxxtx_qa --headless --convert-to pdf --outdir /tmp/czxxtx_render "$source_doc"
          source_pdf="/tmp/czxxtx_render/自适应多尺度加权的多变量网络流量预测_czxxtx20261026_结构精简稿.pdf"
          source_pages=$(pdfinfo "$source_pdf" | awk '/^Pages:/ {print $2}')
          pdftotext "$source_pdf" /tmp/czxxtx_render/original.txt
          pdftotext "$pdf" /tmp/czxxtx_render/integrated.txt
          echo "SOURCE pages=$source_pages; SOURCE refs=$(grep -c '参考文献' /tmp/czxxtx_render/original.txt || true)"
          echo "INTEGRATED refs=$(grep -c '参考文献' /tmp/czxxtx_render/integrated.txt || true)"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          echo "PDF pages=$pages"
          test "$pages" -ge 4
          test "$pages" -le 25
          pdftoppm -jpeg -jpegopt quality=78 -r 105 "$pdf" /tmp/czxxtx_render/page
          dest="paper_template/长江信息通信/结构分析工作/图文整合稿页面预览_20261026"
          mkdir -p "$dest"
          cp /tmp/czxxtx_render/page-*.jpg "$dest/"
          PAGES="$pages" TARGET_DIR="$dest" python - <<'PY'
          import os,json
          from pathlib import Path
          from PIL import Image
          directory=Path(os.environ["TARGET_DIR"])
          shots=sorted(directory.glob("page-*.jpg"))
          count=int(os.environ["PAGES"])
          assert len(shots)==count
          report={"status":"PASS","pages":count,
                  "source":"20261026_图文整合稿.docx",
                  "render_engine":"LibreOffice headless",
                  "screenshots":[{"name":p.name,"size":Image.open(p).size} for p in shots],
                  "warning":"LO layout preview is not a native Microsoft Word pagination guarantee"}
          (directory/"render_check.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(report)
          PY
      - name: Commit non-deliverable layout inspection previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "paper_template/长江信息通信/结构分析工作/图文整合稿页面预览_20261026"
          git commit -m "Add visual layout QA pages for integrated Changjiang manuscript [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
