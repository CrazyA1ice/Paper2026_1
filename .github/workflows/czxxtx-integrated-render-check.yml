name: Render and inspect Changjiang integrated manuscript

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/czxxtx-integrated-render-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Word rendering and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk >/dev/null
      - name: Render whole manuscript
        run: |
          set -euo pipefail
          f="paper_template/长江信息通信/自适应多尺度加权的多变量网络流量预测_czxxtx20261026_图文整合稿.docx"
          test -s "$f"
          mkdir -p /tmp/czxxtx_render
          libreoffice -env:UserInstallation=file:///tmp/lo_czxxtx_qa --headless --convert-to pdf --outdir /tmp/czxxtx_render "$f"
          pdf=$(find /tmp/czxxtx_render -maxdepth 1 -name '*.pdf' -print -quit)
          test -s "$pdf"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          echo "PDF pages=$pages"
          test "$pages" -ge 4
          test "$pages" -le 25
          pdftoppm -jpeg -jpegopt quality=78 -r 105 "$pdf" /tmp/czxxtx_render/page
          dest="paper_template/长江信息通信/结构分析工作/图文整合稿页面预览_20261026"
          mkdir -p "$dest"
          cp /tmp/czxxtx_render/page-*.jpg "$dest/"
          PAGES="$pages" TARGET_DIR="$dest" python - <<'PY'
          import os,json
          from pathlib import Path
          from PIL import Image
          directory=Path(os.environ["TARGET_DIR"])
          shots=sorted(directory.glob("page-*.jpg"))
          count=int(os.environ["PAGES"])
          assert len(shots)==count
          report={"status":"PASS","pages":count,
                  "source":"20261026_图文整合稿.docx",
                  "render_engine":"LibreOffice headless",
                  "screenshots":[{"name":p.name,"size":Image.open(p).size} for p in shots],
                  "warning":"LO layout preview is not a native Microsoft Word pagination guarantee"}
          (directory/"render_check.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(report)
          PY
      - name: Commit non-deliverable layout inspection previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "paper_template/长江信息通信/结构分析工作/图文整合稿页面预览_20261026"
          git commit -m "Add visual layout QA pages for integrated Changjiang manuscript [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
