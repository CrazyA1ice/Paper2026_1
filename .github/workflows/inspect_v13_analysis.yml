name: Inspect v13 analysis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect_v13_analysis.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependencies
        run: python -m pip install -q numpy pandas
      - name: Print v13 experiment sections
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          p="word_output/2026.09.21v13.docx"
          NS={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          body=root.find("w:body",NS)
          children=list(body)
          def txt(e):
              return "".join(x.text or "" for x in e.iter() if x.tag.endswith("}t"))
          start=None; end=None
          for i,e in enumerate(children):
              if e.tag.endswith("}p") and txt(e).strip()=="2 实验与结果分析": start=i
              if start is not None and e.tag.endswith("}p") and txt(e).strip()=="3 结论":
                  end=i; break
          print("RANGE",start,end)
          for i,e in enumerate(children[start:end],start):
              if e.tag.endswith("}p"):
                  t=txt(e).strip()
                  if t: print(f"P {i}: {t}")
              elif e.tag.endswith("}tbl"):
                  print("TABLE",i)
                  for ri,row in enumerate(e.findall("w:tr",NS)):
                      vals=[txt(c).strip() for c in row.findall("w:tc",NS)]
                      print("  ",ri,vals)
          print("INLINE",sum(1 for e in root.iter() if e.tag.endswith("}inline")))
          PY
      - name: Analyze strongest existing evidence
        run: |
          cd abilene_forecasting
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          print("=== EXTERNAL BASELINE PER-SEED REDUCTIONS ===")
          for dataset in ["abilene","geant"]:
              rows=[]
              for seed in [42,43,44]:
                  vals={}
                  for model in ["dlinear","lightts","dlinear_scale"]:
                      p=Path("results")/dataset/f"{model}_seed{seed}"/"metrics.json"
                      m=json.loads(p.read_text(encoding="utf-8"))
                      vals[model]=m["test_normalized"]
                  for metric in ["mse","mae"]:
                      for base in ["dlinear","lightts"]:
                          red=(vals[base][metric]-vals["dlinear_scale"][metric])/vals[base][metric]*100
                          rows.append((seed,metric,base,red))
              df=pd.DataFrame(rows,columns=["seed","metric","base","reduction_pct"])
              print(dataset)
              for (metric,base),g in df.groupby(["metric","base"]):
                  print(metric,base,
                        "values=",np.round(g.reduction_pct.to_numpy(),2).tolist(),
                        "mean=",round(g.reduction_pct.mean(),2),
                        "sd=",round(g.reduction_pct.std(ddof=1),2),
                        "wins=",int((g.reduction_pct>0).sum()),"/",len(g))

          print("=== ROUTER FEATURE RESPONSE, SEEDS 42-49 ===")
          for dataset in ["abilene","geant"]:
              arrays=np.load(Path("data/processed")/f"{dataset}_1hour.npz")
              test=arrays["test"].astype(np.float64)
              L,H=96,24
              n=len(test)-L-H+1
              feats=[]
              for i in range(n):
                  x=test[i:i+L]
                  feats.append([
                      x.mean(),
                      x.std(ddof=0),
                      x[-1].mean(),
                      np.abs(np.diff(x,axis=0)).mean(),
                  ])
              feats=np.asarray(feats)
              names=["mean","std","last","diff"]
              corr=np.zeros((8,4,3))
              qdiff=np.zeros((8,2,3))
              for si,seed in enumerate(range(42,50)):
                  w=np.loadtxt(Path("results")/dataset/f"dlinear_scale_seed{seed}"/"router_weights.csv",delimiter=",")
                  assert len(w)==n
                  for fi in range(4):
                      for ai in range(3):
                          corr[si,fi,ai]=np.corrcoef(feats[:,fi],w[:,ai])[0,1]
                  for qi,fi in enumerate([1,3]):
                      lo=np.quantile(feats[:,fi],0.25); hi=np.quantile(feats[:,fi],0.75)
                      qdiff[si,qi]=w[feats[:,fi]>=hi].mean(axis=0)-w[feats[:,fi]<=lo].mean(axis=0)
              print(dataset)
              for fi,name in enumerate(names):
                  print("corr",name,
                        "alpha1/2/4 mean=",np.round(corr[:,fi,:].mean(axis=0),3).tolist(),
                        "sd=",np.round(corr[:,fi,:].std(axis=0,ddof=1),3).tolist())
              for qi,name in enumerate(["std_Q4-Q1","diff_Q4-Q1"]):
                  print(name,
                        "alpha1/2/4 mean=",np.round(qdiff[:,qi,:].mean(axis=0),3).tolist(),
                        "sd=",np.round(qdiff[:,qi,:].std(axis=0,ddof=1),3).tolist())
          PY
