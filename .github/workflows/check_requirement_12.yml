name: Temporary check journal requirement 12

on:
  push:
    paths:
      - ".github/workflows/check_requirement_12.yml"

permissions:
  contents: read

jobs:
  check:
    if: github.event.head_commit.message == 'temporary journal requirement 12 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect body coverage and figures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re, html

          path=Path("word_output/2026.09.18v.docx")
          with ZipFile(path,"r") as z:
              xml=z.read("word/document.xml").decode("utf-8")
              media=[n for n in z.namelist() if n.startswith("word/media/")]
              print("MEDIA="+repr(media))

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          paras=[m.group(0) for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml)]
          texts=[text_of(p) for p in paras]

          # Body coverage evidence by section titles and representative prose.
          for pat in ["1 自适应多尺度网络流量预测方法","2 实验与结果分析","2.1 数据集与实验设置","2.2 基础模型对比与组件分析","2.3 自适应尺度权重消融与路由分析","2.4 频率保留比例敏感性","2.5 代表性预测与适用范围","3 结论"]:
              hits=[i for i,t in enumerate(texts) if t==pat]
              print(f"SECTION {pat} -> {hits}")

          # Paragraphs containing drawings and local context.
          for i,p in enumerate(paras):
              if "<w:drawing" in p or "<w:pict" in p:
                  print(f"DRAWING[{i}] text={texts[i]}")
                  for j in range(max(0,i-2),min(len(paras),i+3)):
                      if texts[j]:
                          print(f"  NEAR[{j}]={texts[j]}")

          # Figure captions and formatting.
          for i,(p,t) in enumerate(zip(paras,texts)):
              if re.match(r'^图\s*\d+',t):
                  mnum=re.match(r'^图\s*(\d+)',t)
                  num=mnum.group(1) if mnum else "?"
                  ppr=re.search(r'<w:pPr\b[^>]*>[\s\S]*?</w:pPr>',p)
                  centered=bool(re.search(r'<w:jc\b[^>]*w:val="center"[^>]*/>',p))
                  print(f"CAPTION[{i}] num={num} centered={centered} text={t}")
                  print("  PPR="+(ppr.group(0) if ppr else "NONE"))
                  runs=[r for r in re.findall(r'<w:r\b[\s\S]*?</w:r>',p) if text_of(r)]
                  for k,r in enumerate(runs):
                      fm=re.search(r'<w:rFonts\b[^>]*/>',r)
                      sz=re.search(r'<w:sz\b[^>]*/>',r)
                      bold=bool(re.search(r'<w:b(?:\s[^>]*)?/>',r))
                      print(f"  RUN[{k}] text={text_of(r)} fonts={fm.group(0) if fm else None} size={sz.group(0) if sz else None} bold={bold}")

                  # Mentions before caption.
                  mentions=[]
                  for j in range(0,i):
                      if re.search(fr'图\s*{num}(?!\d)',texts[j]):
                          mentions.append((j,texts[j]))
                  print(f"  PRIOR_MENTIONS={mentions[-3:]}")

          # Figure count.
          caps=[t for t in texts if re.match(r'^图\s*\d+',t)]
          print("FIGURE_CAPTION_COUNT="+str(len(caps)))
          PY
