name: Temporary patch journal requirement 12

on:
  push:
    paths:
      - ".github/workflows/patch_requirement_12.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporary journal requirement 12 patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Patch current figure generator to journal typography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path("abilene_forecasting/paper_figures/generate_skill_comparison_figures.py")
          s=p.read_text(encoding="utf-8")

          s=s.replace(
              '"font.family": "sans-serif",\n        "font.sans-serif": ["SimSun", "Times New Roman"],',
              '"font.family": ["Times New Roman", "SimSun", "Liberation Serif", "Noto Serif CJK SC"],'
          )
          s=s.replace('"xtick.labelsize": 7,','"xtick.labelsize": 7.5,')
          s=s.replace('"ytick.labelsize": 7,','"ytick.labelsize": 7.5,')
          s=s.replace('"legend.fontsize": 7,','"legend.fontsize": 7.5,')

          s=s.replace(
              '        label = text_artist.get_text()\n'
              '        family = "SimSun" if any("\\u4e00" <= char <= "\\u9fff" for char in label) else "Times New Roman"\n'
              '        text_artist.set_fontfamily(family)',
              '        text_artist.set_fontfamily(["Times New Roman", "SimSun", "Liberation Serif", "Noto Serif CJK SC"])'
          )

          # Journal requests 六号 (~7.5 pt) figure annotations. Raise all
          # explicit annotation sizes below that threshold without changing data.
          replacements={
              'fs=7.0':'fs=7.5',
              'fs=6.4':'fs=7.5',
              'fs=6.6':'fs=7.5',
              'fs=6.8':'fs=7.5',
              'fs=6.3':'fs=7.5',
              'fontsize=6.3':'fontsize=7.5',
              'fontsize=7.2':'fontsize=7.5',
          }
          for a,b in replacements.items():
              s=s.replace(a,b)

          # Verify all explicit figure-annotation font sizes are at least 7.5 pt.
          vals=[]
          for pat in [r'fontsize\s*=\s*([0-9.]+)', r'\bfs\s*=\s*([0-9.]+)']:
              vals += [float(x) for x in re.findall(pat,s)]
          if any(v < 7.5 for v in vals):
              raise RuntimeError(f"font size below 7.5 remains: {[v for v in vals if v < 7.5]}")
          if 'direction="in"' not in s:
              raise RuntimeError("inward tick setting missing")
          if '"xtick.labelsize": 7.5' not in s or '"legend.fontsize": 7.5' not in s:
              raise RuntimeError("global figure sizes not patched")
          if 'Times New Roman' not in s or 'SimSun' not in s:
              raise RuntimeError("journal font families missing")

          p.write_text(s,encoding="utf-8")
          print("FIGURE_SOURCE_PATCHED")
          PY

      - name: Install dependencies and fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation libreoffice poppler-utils
          python -m pip install --quiet matplotlib pandas numpy pillow lxml
          fc-cache -fv >/dev/null

      - name: Regenerate current SciPilot figures
        shell: bash
        run: |
          python abilene_forecasting/paper_figures/generate_skill_comparison_figures.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          d=Path("abilene_forecasting/paper_figures/scipilot_figure_set")
          names=[
              "S1_小样本透明化消融.png",
              "S2_配对权重消融.png",
              "S4a_路由权重诊断.png",
              "S3_频域敏感性原始轨迹.png",
              "S4b_代表性预测诊断.png",
          ]
          for n in names:
              p=d/n
              if not p.is_file():
                  raise RuntimeError(f"missing regenerated figure {p}")
              with Image.open(p) as im:
                  print(n, im.size, im.info.get("dpi"))
                  if min(im.size) < 1200:
                      raise RuntimeError(f"figure resolution unexpectedly low: {n} {im.size}")
          PY

      - name: Replace figures 2-6 in manuscript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from PIL import Image
          from lxml import etree
          import shutil

          docx=Path("word_output/2026.09.18v.docx")
          tmp=docx.with_suffix(".tmp.docx")
          figdir=Path("abilene_forecasting/paper_figures/scipilot_figure_set")
          repl={
              "word/media/image2.png":figdir/"S1_小样本透明化消融.png",
              "word/media/image3.png":figdir/"S2_配对权重消融.png",
              "word/media/image4.png":figdir/"S4a_路由权重诊断.png",
              "word/media/image5.png":figdir/"S3_频域敏感性原始轨迹.png",
              "word/media/image6.png":figdir/"S4b_代表性预测诊断.png",
          }

          W="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
          A="http://schemas.openxmlformats.org/drawingml/2006/main"
          R="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
          WP="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
          PR="http://schemas.openxmlformats.org/package/2006/relationships"
          ns={"w":W,"a":A,"r":R,"wp":WP,"pr":PR}

          with ZipFile(docx,"r") as zin:
              document=etree.fromstring(zin.read("word/document.xml"))
              rels=etree.fromstring(zin.read("word/_rels/document.xml.rels"))
              relmap={rel.get("Id"):rel.get("Target") for rel in rels.xpath("/pr:Relationships/pr:Relationship",namespaces=ns)}

              # Map each drawing to its media target; update height to preserve new aspect ratio.
              for p in document.xpath("/w:document/w:body/w:p",namespaces=ns):
                  blips=p.xpath(".//a:blip",namespaces=ns)
                  if len(blips)!=1:
                      continue
                  rid=blips[0].get(f"{{{R}}}embed")
                  target="word/"+relmap[rid]
                  if target not in repl:
                      continue
                  with Image.open(repl[target]) as im:
                      pw,ph=im.size
                  ext=p.xpath(".//wp:extent",namespaces=ns)
                  if len(ext)!=1:
                      raise RuntimeError(f"no unique extent for {target}")
                  width=int(ext[0].get("cx"))
                  height=round(width*ph/pw)
                  ext[0].set("cy",str(height))
                  for e in p.xpath(".//a:xfrm/a:ext",namespaces=ns):
                      e.set("cx",str(width)); e.set("cy",str(height))

              newdoc=etree.tostring(document,xml_declaration=True,encoding="UTF-8",standalone=True)

              with ZipFile(tmp,"w",ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename=="word/document.xml":
                          data=newdoc
                      elif item.filename in repl:
                          data=repl[item.filename].read_bytes()
                      else:
                          data=zin.read(item.filename)
                      zout.writestr(item,data)

          shutil.move(tmp,docx)
          print("DOCX_FIGURES_REPLACED")
          PY

      - name: Render full manuscript for QA
        shell: bash
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          pdfinfo qa_render/2026.09.18v.pdf | grep -E 'Pages|Page size'

      - uses: actions/upload-artifact@v4
        with:
          name: journal-requirement-12-qa
          path: qa_render/
          if-no-files-found: error

      - name: Commit manuscript and figure sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             abilene_forecasting/paper_figures/generate_skill_comparison_figures.py             abilene_forecasting/paper_figures/scipilot_figure_set             word_output/2026.09.18v.docx
          git diff --cached --quiet && exit 1
          git commit -m "align manuscript figures with journal requirements"
          git push
