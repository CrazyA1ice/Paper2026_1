name: Temporary check journal requirement 16

on:
  push:
    paths:
      - ".github/workflows/check_requirement_16.yml"

permissions:
  contents: read

jobs:
  check:
    if: github.event.head_commit.message == 'temporary journal requirement 16 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect conclusion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re, html

          path=Path("word_output/2026.09.18v.docx")
          with ZipFile(path,"r") as z:
              xml=z.read("word/document.xml").decode("utf-8")

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          paras=[text_of(m.group(0)) for m in re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml)]
          idx=next(i for i,t in enumerate(paras) if t=="3 结论")
          ridx=next(i for i,t in enumerate(paras[idx+1:],idx+1) if t=="参考文献")
          concl=''.join(t for t in paras[idx+1:ridx] if t)
          abstract=next(t for t in paras if t.startswith("摘要："))[3:]
          intro=''.join(t for t in paras[:idx] if t and ("针对这些问题" in t or "针对上述问题" in t))

          print("CONCLUSION="+concl)
          print("CN_CHARS="+str(len(re.findall(r'[\u4e00-\u9fff]',concl))))
          print("NO_SPACE_CHARS="+str(len(re.sub(r'\s+','',concl))))
          print("ABSTRACT="+abstract)
          print("INTRO_CORE="+intro)
          PY
