name: Temporary patch journal requirement 15b

on:
  push:
    paths:
      - ".github/workflows/patch_requirement_15b.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporary journal requirement 15b patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: python -m pip install --quiet lxml matplotlib pandas numpy pillow

      - name: Fix inline quantity typography and figure math labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from lxml import etree
          import re, shutil

          # ---------- Patch Word inline math-like prose ----------
          docx=Path("word_output/2026.09.18v.docx")
          tmp=docx.with_suffix(".tmp.docx")
          W="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
          M="http://schemas.openxmlformats.org/officeDocument/2006/math"
          ns={"w":W,"m":M}
          q=lambda u,t:f"{{{u}}}{t}"

          token_map={
            "Ŷ_n=f_θ(X_n)":[("Ŷ",1,1,None),("n",1,0,"subscript"),("=",0,0,None),("f",1,0,None),("θ",1,0,"subscript"),("(",0,0,None),("X",1,1,None),("n",1,0,"subscript"),(")",0,0,None)],
            "μ_c^{tr}":[("μ",1,0,None),("c",1,0,"subscript"),("tr",0,0,"superscript")],
            "σ_c^{tr}":[("σ",1,0,None),("c",1,0,"subscript"),("tr",0,0,"superscript")],
            "T^{(s)}":[("T",1,1,None),("(",0,0,"superscript"),("s",1,0,"superscript"),(")",0,0,"superscript")],
            "R^{(s)}":[("R",1,1,None),("(",0,0,"superscript"),("s",1,0,"superscript"),(")",0,0,"superscript")],
            "α_{n,s}":[("α",1,0,None),("n,s",1,0,"subscript")],
            "v_{t,c}":[("v",1,0,None),("t,c",1,0,"subscript")],
            "x_t":[("x",1,0,None),("t",1,0,"subscript")],
            "R^C":[("R",1,0,None),("C",1,0,"superscript")],
            "X_n":[("X",1,1,None),("n",1,0,"subscript")],
            "z_n":[("z",1,1,None),("n",1,0,"subscript")],
            "μ_n":[("μ",1,0,None),("n",1,0,"subscript")],
            "σ_n":[("σ",1,0,None),("n",1,0,"subscript")],
            "ℓ_n":[("ℓ",1,0,None),("n",1,0,"subscript")],
            "d_n":[("d",1,0,None),("n",1,0,"subscript")],
            "L_s":[("L",1,0,None),("s",1,0,"subscript")],
            "N_te":[("N",1,0,None),("te",0,0,"subscript")],
            "d_z":[("d",1,0,None),("z",0,0,"subscript")],
          }
          keys=sorted(token_map,key=len,reverse=True)
          token_re=re.compile("|".join(re.escape(k) for k in keys))
          single_vars=set("LHCqsrptNnckmidxvuSj")

          def make_run(text,italic=False,bold=False,vert=None):
              r=etree.Element(q(W,"r"))
              rpr=etree.SubElement(r,q(W,"rPr"))
              fonts=etree.SubElement(rpr,q(W,"rFonts"))
              fonts.set(q(W,"ascii"),"Times New Roman")
              fonts.set(q(W,"hAnsi"),"Times New Roman")
              fonts.set(q(W,"eastAsia"),"宋体")
              fonts.set(q(W,"cs"),"Times New Roman")
              etree.SubElement(rpr,q(W,"sz")).set(q(W,"val"),"21")
              etree.SubElement(rpr,q(W,"szCs")).set(q(W,"val"),"21")
              if italic:
                  etree.SubElement(rpr,q(W,"i"))
                  etree.SubElement(rpr,q(W,"iCs"))
              if bold:
                  etree.SubElement(rpr,q(W,"b"))
                  etree.SubElement(rpr,q(W,"bCs"))
              if vert:
                  etree.SubElement(rpr,q(W,"vertAlign")).set(q(W,"val"),vert)
              t=etree.SubElement(r,q(W,"t"))
              if text[:1].isspace() or text[-1:].isspace():
                  t.set("{http://www.w3.org/XML/1998/namespace}space","preserve")
              t.text=text
              return r

          def emit_plain(parent,segment):
              # Italicize isolated quantity symbols while leaving units/English words upright.
              last=0
              for m in re.finditer(r"(?<![A-Za-z'])([LHCqsrptNnckmidxvuSj])(?![A-Za-z])",segment):
                  a,b=m.span(1); ch=m.group(1)
                  # hour unit h is intentionally absent from variable set
                  if a>last:
                      parent.append(make_run(segment[last:a]))
                  parent.append(make_run(ch,italic=True))
                  last=b
              if last<len(segment):
                  parent.append(make_run(segment[last:]))

          def rebuild_paragraph(p,text):
              # preserve pPr only
              for child in list(p):
                  if child.tag!=q(W,"pPr"):
                      p.remove(child)
              pos=0
              for m in token_re.finditer(text):
                  if m.start()>pos:
                      emit_plain(p,text[pos:m.start()])
                  for piece,it,bo,vert in token_map[m.group(0)]:
                      p.append(make_run(piece,bool(it),bool(bo),vert))
                  pos=m.end()
              if pos<len(text):
                  emit_plain(p,text[pos:])

          with ZipFile(docx,"r") as zin:
              root=etree.fromstring(zin.read("word/document.xml"))
              paras=root.xpath("/w:document/w:body/w:p",namespaces=ns)
              def ptext(p): return ''.join(p.xpath(".//w:t/text()",namespaces=ns))

              changed=0
              for p in paras:
                  text=ptext(p)
                  # Only rebuild paragraphs that contain TeX-like math remnants,
                  # excluding the literal dataset field name.
                  residual=text.replace("matrix_avg_realOD","")
                  if any(ch in residual for ch in ["_","^"]):
                      rebuild_paragraph(p,text)
                      changed+=1

              # Table quantity symbol r should also be italic.
              for t in root.xpath(".//w:tbl//w:t",namespaces=ns):
                  txt=t.text or ""
                  if txt=="r":
                      r=t.getparent()
                      rpr=r.find(q(W,"rPr"))
                      if rpr is None:
                          rpr=etree.Element(q(W,"rPr")); r.insert(0,rpr)
                      if rpr.find(q(W,"i")) is None: etree.SubElement(rpr,q(W,"i"))
                      if rpr.find(q(W,"iCs")) is None: etree.SubElement(rpr,q(W,"iCs"))
                  elif txt.startswith("r="):
                      # split cell run into italic r + upright remainder
                      r=t.getparent(); parent=r.getparent(); idx=parent.index(r)
                      parent.insert(idx,make_run("r",italic=True)); idx+=1
                      parent.insert(idx,make_run(txt[1:])); parent.remove(r)

              # Verify no math-like underscore/caret remains in main-body prose,
              # except the literal dataset field name.
              bad=[]
              for p in root.xpath("/w:document/w:body/w:p",namespaces=ns):
                  text=''.join(p.xpath(".//w:t/text()",namespaces=ns))
                  residual=text.replace("matrix_avg_realOD","")
                  if "_" in residual or "^" in residual:
                      bad.append(text)
              if bad:
                  raise RuntimeError(f"inline TeX remnants remain: {bad}")
              if changed < 10:
                  raise RuntimeError(f"expected >=10 inline paragraphs changed, got {changed}")

              data=etree.tostring(root,xml_declaration=True,encoding="UTF-8",standalone=True)
              with ZipFile(tmp,"w",ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      zout.writestr(item,data if item.filename=="word/document.xml" else zin.read(item.filename))
          shutil.move(tmp,docx)
          print(f"INLINE_MATH_FIXED={changed}")

          # ---------- Patch currently used figure source ----------
          src=Path("abilene_forecasting/paper_figures/generate_skill_comparison_figures.py")
          s=src.read_text(encoding="utf-8")
          s=s.replace('ax.set_xlabel("频域保留比例 r")','ax.set_xlabel("频域保留比例 $r$")')
          s=s.replace('"样本级权重分布（n=2439/尺度）"','"样本级权重分布（$n$=2439/尺度）"')
          s=s.replace('["无频域", "r=0.50", "r=0.75"]','["无频域", "$r$=0.50", "$r$=0.75"]')
          s=s.replace('"权重分布（n=2439/尺度）"','"权重分布（$n$=2439/尺度）"')
          if '频域保留比例 r' in s or '（n=2439/尺度）' in s or '"r=0.50"' in s:
              raise RuntimeError("upright figure quantity labels remain")
          src.write_text(s,encoding="utf-8")
          print("FIGURE_MATH_LABELS_FIXED")
          PY

      - name: Regenerate current figures
        run: |
          python abilene_forecasting/paper_figures/generate_skill_comparison_figures.py

      - name: Replace figures 2-6 in manuscript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from PIL import Image
          from lxml import etree
          import shutil

          docx=Path("word_output/2026.09.18v.docx")
          tmp=docx.with_suffix(".tmp.docx")
          figdir=Path("abilene_forecasting/paper_figures/scipilot_figure_set")
          repl={
              "word/media/image2.png":figdir/"S1_小样本透明化消融.png",
              "word/media/image3.png":figdir/"S2_配对权重消融.png",
              "word/media/image4.png":figdir/"S4a_路由权重诊断.png",
              "word/media/image5.png":figdir/"S3_频域敏感性原始轨迹.png",
              "word/media/image6.png":figdir/"S4b_代表性预测诊断.png",
          }
          W="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
          A="http://schemas.openxmlformats.org/drawingml/2006/main"
          R="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
          WP="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
          PR="http://schemas.openxmlformats.org/package/2006/relationships"
          ns={"w":W,"a":A,"r":R,"wp":WP,"pr":PR}

          with ZipFile(docx,"r") as zin:
              document=etree.fromstring(zin.read("word/document.xml"))
              rels=etree.fromstring(zin.read("word/_rels/document.xml.rels"))
              relmap={rel.get("Id"):rel.get("Target") for rel in rels.xpath("/pr:Relationships/pr:Relationship",namespaces=ns)}
              for p in document.xpath("/w:document/w:body/w:p",namespaces=ns):
                  blips=p.xpath(".//a:blip",namespaces=ns)
                  if len(blips)!=1: continue
                  rid=blips[0].get(f"{{{R}}}embed")
                  target="word/"+relmap[rid]
                  if target not in repl: continue
                  with Image.open(repl[target]) as im: pw,ph=im.size
                  ext=p.xpath(".//wp:extent",namespaces=ns)
                  if len(ext)!=1: continue
                  width=int(ext[0].get("cx")); height=round(width*ph/pw)
                  ext[0].set("cy",str(height))
                  for e in p.xpath(".//a:xfrm/a:ext",namespaces=ns):
                      e.set("cx",str(width)); e.set("cy",str(height))
              newdoc=etree.tostring(document,xml_declaration=True,encoding="UTF-8",standalone=True)
              with ZipFile(tmp,"w",ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename=="word/document.xml": data=newdoc
                      elif item.filename in repl: data=repl[item.filename].read_bytes()
                      else: data=zin.read(item.filename)
                      zout.writestr(item,data)
          shutil.move(tmp,docx)
          print("FIGURES_REPLACED")
          PY

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk fonts-liberation
          fc-cache -fv >/dev/null

      - name: Render full manuscript
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          pdfinfo qa_render/2026.09.18v.pdf | grep -E 'Pages|Page size'

      - uses: actions/upload-artifact@v4
        with:
          name: journal-requirement-15b-qa
          path: qa_render/
          if-no-files-found: error

      - name: Commit manuscript and figure source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.18v.docx abilene_forecasting/paper_figures/generate_skill_comparison_figures.py abilene_forecasting/paper_figures/scipilot_figure_set
          git diff --cached --quiet && exit 1
          git commit -m "finish journal requirement 15 quantity and unit typography"
          git push
