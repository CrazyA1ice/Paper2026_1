name: Inspect references for baselines
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect_refs.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print reference paragraphs
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          p="word_output/2026.09.19v2.docx"
          NS={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          body=root.find("w:body",NS)
          on=False
          for i,el in enumerate(list(body)):
              if not el.tag.endswith("}p"): continue
              t="".join(e.text or "" for e in el.iter() if e.tag.endswith("}t")).strip()
              if "参考文献" in t: on=True
              if on and t: print(i,t)
          PY
