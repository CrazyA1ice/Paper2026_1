name: Temporary patch journal requirement 16

on:
  push:
    paths:
      - ".github/workflows/patch_requirement_16.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'temporary journal requirement 16 patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compress conclusion to journal limit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, html, shutil

          path=Path("word_output/2026.09.18v.docx")
          tmp=path.with_suffix(".tmp.docx")
          new_text="实验验证了样本级尺度路由对OD流量预测的增益，核心价值在于以轻量动态权重替代固定尺度组合；频域门控未带来额外优势，表明性能提升主要来自尺度自适应。当前验证仅限Abilene、固定预测长度且未建模拓扑，后续将扩展多数据集、多预测尺度及拓扑约束。"

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          def esc(s):
              return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

          def replace_para_text(p,s):
              first=True
              def repl(m):
                  nonlocal first
                  attrs=m.group(1) or ""
                  if first:
                      first=False
                      return f'<w:t{attrs}>{esc(s)}</w:t>'
                  return f'<w:t{attrs}></w:t>'
              return re.sub(r'<w:t(\s[^>]*)?>([\s\S]*?)</w:t>',repl,p)

          with ZipFile(path,"r") as zin:
              xml=zin.read("word/document.xml").decode("utf-8")
              paras=list(re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml))
              texts=[text_of(m.group(0)) for m in paras]
              idx=next(i for i,t in enumerate(texts) if t=="3 结论")
              ridx=next(i for i,t in enumerate(texts[idx+1:],idx+1) if t=="参考文献")
              body=[i for i in range(idx+1,ridx) if texts[i]]
              if len(body)!=1:
                  raise RuntimeError(f"expected one conclusion paragraph, got {body}")

              target=paras[body[0]]
              newp=replace_para_text(target.group(0),new_text)
              new_xml=xml[:target.start()]+newp+xml[target.end():]

              cn=len(re.findall(r'[\u4e00-\u9fff]',new_text))
              no_space=len(re.sub(r'\s+','',new_text))
              if cn>150 or no_space>150:
                  raise RuntimeError(f"conclusion still over limit: cn={cn}, no_space={no_space}")
              if any(x in new_text for x in ["4.06%","10.52%","3.95%"]):
                  raise RuntimeError("abstract metrics repeated in conclusion")
              for key in ["动态权重","固定尺度组合","频域门控","Abilene","拓扑","后续"]:
                  if key not in new_text:
                      raise RuntimeError(f"required conclusion element missing: {key}")

              with ZipFile(tmp,"w",ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      data=new_xml.encode("utf-8") if item.filename=="word/document.xml" else zin.read(item.filename)
                      zout.writestr(item,data)

          shutil.move(tmp,path)
          print(f"CN_CHARS={cn}")
          print(f"NO_SPACE_CHARS={no_space}")
          print("STATUS=FIXED")
          PY

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fc-cache -fv >/dev/null

      - name: Render full manuscript
        shell: bash
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          pdfinfo qa_render/2026.09.18v.pdf | grep -E 'Pages|Page size'

      - uses: actions/upload-artifact@v4
        with:
          name: journal-requirement-16-qa
          path: qa_render/
          if-no-files-found: error

      - name: Commit manuscript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.18v.docx
          git diff --cached --quiet && exit 1
          git commit -m "apply journal requirement 16 concise conclusion"
          git push
