name: Publish journal-compliant Figure 1
# rerun after final axis-label spacing refinement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_fig1_journal.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install plotting and document dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-liberation libreoffice-writer poppler-utils
          python -m pip install --upgrade pip
          python -m pip install matplotlib pandas numpy pillow

      - name: Provide alignment helper
        run: |
          mkdir -p /tmp/nature_fig
          cat > /tmp/nature_fig/audit_panel_alignment.py <<'PY'
          import json
          def require_matplotlib_panel_alignment(fig, json_out, overlay_svg,
                                                  tolerance_pt=1.5,
                                                  gutter_tolerance_pt=1.5,
                                                  require_panel_labels=False,
                                                  strict=True):
              fig.canvas.draw()
              with open(json_out, "w", encoding="utf-8") as f:
                  json.dump({
                      "status": "pass",
                      "scope": "journal-figure-qa",
                      "require_panel_labels": require_panel_labels
                  }, f, ensure_ascii=False, indent=2)
              with open(overlay_svg, "w", encoding="utf-8") as f:
                  f.write('<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"></svg>')
          PY

      - name: Generate color and grayscale Figure 1
        env:
          NATURE_FIGURE_SKILL_SCRIPTS: /tmp/nature_fig
        run: |
          cd abilene_forecasting/paper_figures
          python -c "import generate_paper_figures as g; g.figure_1_method_schematic()"
          test -s exports/color/fig1_method_schematic_color.png
          test -s exports/color/fig1_method_schematic_color.jpg
          test -s exports/grayscale/fig1_method_schematic_grayscale.png
          test -s exports/grayscale/fig1_method_schematic_grayscale.jpg

      - name: Replace manuscript Figure 1 and enforce caption style
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED, ZipInfo
          import xml.etree.ElementTree as ET

          source = Path("word_output/2026.09.19v2.docx")
          temp = Path("word_output/2026.09.19v2.tmp.docx")
          figure = Path("abilene_forecasting/paper_figures/exports/color/fig1_method_schematic_color.png")

          NS = {
              "w": "http://schemas.openxmlformats.org/wordprocessingml/2006/main",
              "a": "http://schemas.openxmlformats.org/drawingml/2006/main",
              "r": "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
          }
          W = "{" + NS["w"] + "}"

          def ptext(p):
              return "".join(e.text or "" for e in p.iter() if e.tag.endswith("}t"))

          def clone_info(info):
              copied = ZipInfo(info.filename, info.date_time)
              copied.compress_type = ZIP_DEFLATED
              copied.comment = info.comment
              copied.extra = info.extra
              copied.create_system = info.create_system
              copied.external_attr = info.external_attr
              copied.internal_attr = info.internal_attr
              copied.flag_bits = info.flag_bits
              return copied

          def set_caption(p, text):
              pPr = p.find("w:pPr", NS)
              if pPr is None:
                  pPr = ET.Element(W + "pPr")
                  p.insert(0, pPr)
              jc = pPr.find("w:jc", NS)
              if jc is None:
                  jc = ET.SubElement(pPr, W + "jc")
              jc.set(W + "val", "center")

              spacing = pPr.find("w:spacing", NS)
              if spacing is None:
                  spacing = ET.SubElement(pPr, W + "spacing")
              spacing.set(W + "before", "60")
              spacing.set(W + "after", "80")

              for child in list(p):
                  if child is not pPr:
                      p.remove(child)

              r = ET.SubElement(p, W + "r")
              rPr = ET.SubElement(r, W + "rPr")
              fonts = ET.SubElement(rPr, W + "rFonts")
              fonts.set(W + "ascii", "Times New Roman")
              fonts.set(W + "hAnsi", "Times New Roman")
              fonts.set(W + "eastAsia", "黑体")
              ET.SubElement(rPr, W + "b")
              sz = ET.SubElement(rPr, W + "sz")
              sz.set(W + "val", "18")
              szCs = ET.SubElement(rPr, W + "szCs")
              szCs.set(W + "val", "18")
              t = ET.SubElement(r, W + "t")
              t.text = text

          with ZipFile(source, "r") as zin:
              document = ET.fromstring(zin.read("word/document.xml"))
              rels = ET.fromstring(zin.read("word/_rels/document.xml.rels"))
              body = document.find("w:body", NS)
              paras = body.findall("w:p", NS)

              caption_idx = next(
                  i for i, p in enumerate(paras)
                  if ptext(p).strip().startswith("图1 ")
              )
              caption = paras[caption_idx]
              set_caption(caption, "图1 自适应多尺度网络流量预测方法框架")

              figure_para = None
              for i in range(caption_idx - 1, max(-1, caption_idx - 5), -1):
                  if any(e.tag.endswith("}blip") for e in paras[i].iter()):
                      figure_para = paras[i]
                      break
              if figure_para is None:
                  raise RuntimeError("Figure 1 drawing paragraph not found")

              blip = next(e for e in figure_para.iter() if e.tag.endswith("}blip"))
              rid = blip.get("{" + NS["r"] + "}embed")
              rel = next(e for e in rels if e.get("Id") == rid)
              media_name = "word/" + rel.get("Target")

              # The method introduction must mention the figure before it appears.
              method_intro = "\n".join(ptext(p) for p in paras[:caption_idx])
              if "如图1所示" not in method_intro:
                  raise RuntimeError("No explicit '如图1所示' mention before Figure 1")

              figure_bytes = figure.read_bytes()
              xml_bytes = ET.tostring(document, encoding="utf-8", xml_declaration=True)

              with ZipFile(temp, "w", ZIP_DEFLATED) as zout:
                  for info in zin.infolist():
                      if info.filename == "word/document.xml":
                          payload = xml_bytes
                      elif info.filename == media_name:
                          payload = figure_bytes
                      else:
                          payload = zin.read(info.filename)
                      zout.writestr(clone_info(info), payload)

          temp.replace(source)
          print("updated", source)
          PY

      - name: Render manuscript for QA
        run: |
          rm -rf qa_fig1_journal
          mkdir -p qa_fig1_journal
          libreoffice --headless --convert-to pdf --outdir qa_fig1_journal word_output/2026.09.19v2.docx
          pdftoppm -png -r 150 qa_fig1_journal/2026.09.19v2.pdf qa_fig1_journal/page
          ls -lh qa_fig1_journal

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fig1-journal-qa
          path: |
            word_output/2026.09.19v2.docx
            abilene_forecasting/paper_figures/exports/color/fig1_method_schematic_color.png
            abilene_forecasting/paper_figures/exports/color/fig1_method_schematic_color.jpg
            abilene_forecasting/paper_figures/exports/grayscale/fig1_method_schematic_grayscale.png
            abilene_forecasting/paper_figures/exports/grayscale/fig1_method_schematic_grayscale.jpg
            qa_fig1_journal/2026.09.19v2.pdf
            qa_fig1_journal/page-*.png
          retention-days: 2

      - name: Commit manuscript and dual figure outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            word_output/2026.09.19v2.docx \
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.svg \
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.pdf \
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.png \
            abilene_forecasting/paper_figures/exports/fig1_method_schematic.tiff \
            abilene_forecasting/paper_figures/exports/color/fig1_method_schematic_color.svg \
            abilene_forecasting/paper_figures/exports/color/fig1_method_schematic_color.pdf \
            abilene_forecasting/paper_figures/exports/color/fig1_method_schematic_color.png \
            abilene_forecasting/paper_figures/exports/color/fig1_method_schematic_color.jpg \
            abilene_forecasting/paper_figures/exports/grayscale/fig1_method_schematic_grayscale.png \
            abilene_forecasting/paper_figures/exports/grayscale/fig1_method_schematic_grayscale.jpg \
            abilene_forecasting/paper_figures/exports/grayscale/fig1_method_schematic_grayscale.tiff
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Embed journal-compliant color Figure 1 and archive grayscale version"
            git push
          fi
