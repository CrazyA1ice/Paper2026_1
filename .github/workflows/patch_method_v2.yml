name: Patch method chapter v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_method_v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install document tools
        run: |
          python -m pip install lxml pillow
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk
      - name: Patch method chapter and replace Figure 1
        run: |
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED, ZipInfo
          from lxml import etree

          ROOT = Path.cwd()
          source = ROOT / "word_output" / "2026.09.19v1.docx"
          output = ROOT / "word_output" / "2026.09.19v2.docx"
          figure = ROOT / "abilene_forecasting" / "paper_figures" / "exports" / "fig1_method_schematic.png"

          NS = {
              "w": "http://schemas.openxmlformats.org/wordprocessingml/2006/main",
              "a": "http://schemas.openxmlformats.org/drawingml/2006/main",
              "r": "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
              "pr": "http://schemas.openxmlformats.org/package/2006/relationships",
          }
          W = "{%s}" % NS["w"]

          def clone_info(info):
              copied = ZipInfo(info.filename, info.date_time)
              copied.compress_type = ZIP_DEFLATED
              copied.comment = info.comment
              copied.extra = info.extra
              copied.create_system = info.create_system
              copied.external_attr = info.external_attr
              copied.internal_attr = info.internal_attr
              copied.flag_bits = info.flag_bits
              return copied

          def text_nodes(p):
              return [e for e in p.iter() if etree.QName(e).localname == "t"]

          def ptext(p):
              return "".join(e.text or "" for e in text_nodes(p))

          def replace_span(p, old, new, count=1):
              nodes = text_nodes(p)
              full = "".join(n.text or "" for n in nodes)
              pos = full.find(old)
              if pos < 0:
                  raise RuntimeError(f"Cannot find replacement text: {old!r} in {full!r}")
              if count != 1:
                  raise RuntimeError("Only single replacements are supported")
              end = pos + len(old)
              starts = []
              cur = 0
              for n in nodes:
                  txt = n.text or ""
                  starts.append((cur, cur + len(txt), n))
                  cur += len(txt)
              srec = next(x for x in starts if x[0] <= pos < x[1] or (pos == x[1] and pos == end))
              erec = next(x for x in starts if x[0] < end <= x[1])
              s0, s1, sn = srec
              e0, e1, en = erec
              if sn is en:
                  txt = sn.text or ""
                  sn.text = txt[:pos-s0] + new + txt[end-s0:]
                  return
              stxt = sn.text or ""
              etxt = en.text or ""
              sn.text = stxt[:pos-s0] + new
              active = False
              for _, _, n in starts:
                  if n is sn:
                      active = True
                      continue
                  if not active:
                      continue
                  if n is en:
                      n.text = etxt[end-e0:]
                      break
                  n.text = ""

          def set_plain_paragraph_text(p, new_text):
              pPr = p.find("w:pPr", NS)
              first_r = p.find("w:r", NS)
              rPr = None
              if first_r is not None:
                  old_rPr = first_r.find("w:rPr", NS)
                  if old_rPr is not None:
                      rPr = deepcopy(old_rPr)
              for child in list(p):
                  if child is not pPr:
                      p.remove(child)
              r = etree.SubElement(p, W + "r")
              if rPr is not None:
                  r.append(rPr)
              t = etree.SubElement(r, W + "t")
              t.text = new_text

          with ZipFile(source, "r") as zin:
              document = etree.fromstring(zin.read("word/document.xml"))
              rels = etree.fromstring(zin.read("word/_rels/document.xml.rels"))
              body = document.find("w:body", NS)

              def find_para(exact=None, contains=None):
                  matches = []
                  for p in body.findall("w:p", NS):
                      t = ptext(p).strip()
                      if exact is not None and t == exact:
                          matches.append(p)
                      elif contains is not None and contains in t:
                          matches.append(p)
                  if len(matches) != 1:
                      raise RuntimeError(f"Expected one paragraph for exact={exact!r} contains={contains!r}, got {len(matches)}")
                  return matches[0]

              # 1) Opening paragraph: remove frequency branch and match new Figure 1.
              p = find_para(exact="本文方法由预处理、多尺度构造、尺度专家、统计路由和预测融合五部分组成。无频域自适应多尺度结构作为主模型；可学习低频门控作为辅助模块，仅用于分析频率保留比例。整体流程如图1所示。")
              set_plain_paragraph_text(
                  p,
                  "本文方法由数据预处理、多尺度序列构造、DLinear尺度专家、样本级统计路由和自适应预测融合五部分组成。输入窗口经尺度1、2和4构造不同时间分辨率，由三个独立DLinear专家分别预测；路由器依据原始窗口统计状态生成Softmax尺度权重，对专家输出进行样本级动态加权。整体流程如图1所示。"
              )

              # 2) Generalize channel dimension without disturbing surrounding equations.
              p = find_para(contains="本文取输入长度")
              nodes = text_nodes(p)
              changed_c = False
              for n in nodes:
                  if (n.text or "") == "C=144":
                      n.text = "C"
                      changed_c = True
                      break
              if not changed_c:
                  replace_span(p, "C=144", "C")
              for n in nodes:
                  if n.text and "，学习映射" in n.text:
                      n.text = n.text.replace("，学习映射", "随具体数据集的有效OD维度确定，学习映射", 1)
                      break
              else:
                  raise RuntimeError("Could not append dataset-dependent C explanation")

              # 3) Correct DLinear reference and generalize expert description.
              p = find_para(contains="每个尺度配置一个独立DLinear专家")
              replace_span(p, "DLinear专家[7]", "DLinear专家[4]")
              p = find_para(contains="同一尺度内的144个变量")
              replace_span(p, "同一尺度内的144个变量", "同一尺度内的C个变量")

              # 4) Remove the complete frequency-domain subsection.
              children = list(body)
              start = next(i for i,x in enumerate(children) if x.tag == W+"p" and ptext(x).strip() == "1.5 辅助频域门控")
              end = next(i for i,x in enumerate(children) if i > start and x.tag == W+"p" and ptext(x).strip() == "1.6 训练目标与复杂度")
              for x in children[start:end]:
                  body.remove(x)

              # 5) Renumber and rewrite training-objective subsection.
              p = find_para(exact="1.6 训练目标与复杂度")
              set_plain_paragraph_text(p, "1.5 训练目标与模型复杂度")

              p = find_para(contains="无频域自适应多尺度模型含8339个可训练参数")
              old_tail = "无频域自适应多尺度模型含8339个可训练参数；加入频域门控后，参数量随保留频率数变化，r=0.50和r=0.75时分别为8381和8402。其参数增加主要来自尺度专家和门控，不涉及大型注意力矩阵。依据消融结果，无频域版本作为主要方法，频域版本作为敏感性分析对象。"
              new_tail = "单尺度DLinear、固定等权多尺度和自适应多尺度模型分别含4656、8208和8339个可训练参数，其中样本级路由器相对固定等权版本仅增加131个参数。模型不包含大型注意力矩阵或显式拓扑模块，结构复杂度主要来自三个尺度专家。"
              replace_span(p, old_tail, new_tail)

              # 6) Close equation-number gaps created by deleting old equations (14)-(17).
              replacements = {
                  "(18)": "(14)",
                  "(19)": "(15)",
                  "(20)": "(16)",
              }
              for para in body.findall("w:p", NS):
                  t = ptext(para)
                  for old, new in replacements.items():
                      if old in t:
                          replace_span(para, old, new)
                          t = ptext(para)

              # 7) Replace the embedded Figure 1 with the new no-frequency schematic.
              paras = body.findall("w:p", NS)
              caption_idx = next(i for i,p in enumerate(paras) if ptext(p).strip() == "图1 自适应多尺度预测框架")
              fig_para = None
              for i in range(caption_idx - 1, max(-1, caption_idx - 4), -1):
                  if paras[i].xpath(".//a:blip", namespaces=NS):
                      fig_para = paras[i]
                      break
              if fig_para is None:
                  raise RuntimeError("Could not locate Figure 1 drawing paragraph")
              blips = fig_para.xpath(".//a:blip", namespaces=NS)
              if len(blips) != 1:
                  raise RuntimeError(f"Figure 1 expected one image, got {len(blips)}")
              rel_id = blips[0].get("{%s}embed" % NS["r"])
              rel = rels.xpath(f"/pr:Relationships/pr:Relationship[@Id='{rel_id}']", namespaces=NS)
              if len(rel) != 1:
                  raise RuntimeError("Could not resolve Figure 1 relationship")
              target = rel[0].get("Target")
              media_name = "word/" + target

              # 8) Structural assertions before writing.
              all_text = "\n".join(ptext(p) for p in body.findall("w:p", NS))
              method_text = all_text[all_text.index("1 自适应多尺度网络流量预测方法"):all_text.index("2 实验与结果分析")]
              for forbidden in ["1.5 辅助频域门控", "RFFT", "IRFFT", "频率保留比例", "可学习低频门控"]:
                  if forbidden in method_text:
                      raise RuntimeError(f"Forbidden method text remains: {forbidden}")
              required = [
                  "1.5 训练目标与模型复杂度",
                  "同一尺度内的C个变量",
                  "DLinear专家[4]",
                  "C随具体数据集的有效OD维度确定",
              ]
              for item in required:
                  if item not in method_text:
                      raise RuntimeError(f"Required method text missing: {item}")

              updated_document = etree.tostring(document, xml_declaration=True, encoding="UTF-8", standalone=True)
              figure_bytes = figure.read_bytes()

              with ZipFile(output, "w", ZIP_DEFLATED) as zout:
                  for info in zin.infolist():
                      if info.filename == "word/document.xml":
                          payload = updated_document
                      elif info.filename == media_name:
                          payload = figure_bytes
                      else:
                          payload = zin.read(info.filename)
                      zout.writestr(clone_info(info), payload)

          print(output)
          PY
      - name: Verify patched text
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          p="word_output/2026.09.19v2.docx"
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          ns={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          body=root.find("w:body",ns)
          lines=[]
          for i,x in enumerate(list(body)):
              if x.tag.endswith("}p"):
                  t="".join(e.text or "" for e in x.iter() if e.tag.endswith("}t"))
                  if t:
                      lines.append((i,t))
          start=next(k for k,(_,t) in enumerate(lines) if t.strip()=="1 自适应多尺度网络流量预测方法")
          end=next(k for k,(_,t) in enumerate(lines[start+1:], start+1) if t.strip()=="2 实验与结果分析")
          for i,t in lines[start:end+1]:
              print(f"PARA {i}: {t}")
          PY
      - name: Render DOCX for visual QA
        run: |
          mkdir -p qa_method_v2
          libreoffice --headless --convert-to pdf --outdir qa_method_v2 word_output/2026.09.19v2.docx
          pdftoppm -png -r 144 qa_method_v2/2026.09.19v2.pdf qa_method_v2/page
          ls -lh qa_method_v2
      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: method-v2-qa
          path: |
            word_output/2026.09.19v2.docx
            qa_method_v2/2026.09.19v2.pdf
            qa_method_v2/page-*.png
          retention-days: 2
      - name: Commit v2 manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.19v2.docx
          git commit -m "Refactor method chapter for adaptive multiscale core" || exit 0
          git push
