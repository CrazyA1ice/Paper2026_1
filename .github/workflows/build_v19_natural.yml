name: Build natural-style v19 manuscript
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_v19_natural.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-liberation libreoffice-writer poppler-utils
          python -m pip install --upgrade pip
          python -m pip install python-docx pillow
      - name: Build v19
        run: python word_output/humanize_v18_to_v19.py
      - name: Audit and render
        run: |
          python - <<'PY'
          from docx import Document
          p="word_output/2026.09.21v19.docx"
          d=Document(p)
          assert len(d.tables)==3
          assert len(d.inline_shapes)==4
          text="\n".join(x.text for x in d.paragraphs)
          for x in ["4.06%","4.43%","29.89%","46.83%","1.67%","4.68%","0.186","0.434","2.77%","2.37%"]:
              assert x in text
          print("paragraphs",len(d.paragraphs),"tables",len(d.tables),"figures",len(d.inline_shapes))
          PY
          rm -rf word_output/render_v19_word
          mkdir -p word_output/render_v19_word
          libreoffice --headless --convert-to pdf --outdir word_output/render_v19_word word_output/2026.09.21v19.docx
          pdftoppm -png -r 170 word_output/render_v19_word/2026.09.21v19.pdf word_output/render_v19_word/page
          pages=$(find word_output/render_v19_word -name 'page-*.png' | wc -l)
          echo "Rendered pages: $pages"
          test "$pages" -ge 8
          test "$pages" -le 11
      - name: Commit v19
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.21v19.docx word_output/render_v19_word/
          git commit -m "Reduce formulaic prose in v19 manuscript" || exit 0
          git push
