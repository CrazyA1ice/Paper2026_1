name: Temporary check journal requirement 8

on:
  push:
    paths:
      - ".github/workflows/check_requirement_08.yml"

permissions:
  contents: write

jobs:
  check:
    if: github.event.head_commit.message == 'temporary journal requirement 8 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and conditionally fix English front matter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re, html, shutil

          path=Path("word_output/2026.09.18v.docx")
          tmp=path.with_suffix(".tmp.docx")

          zh_title="基于自适应多尺度加权的多变量网络流量预测方法"
          zh_author="[请填写作者姓名]"
          zh_aff="（[请填写工作单位] [请填写部门]，[省 市 邮编]）"

          expected_en_title="A Multivariate Network Traffic Forecasting Method Based on Adaptive Multiscale Weighting"
          expected_en_author="[Author Name]"
          old_en_aff="([Affiliation], [City] [Postcode], China; Corresponding author: [Name], E-mail: [E-mail])"
          new_en_aff="([Affiliation] [Department], [City] [Postcode], China; Corresponding author: [Name], E-mail: [E-mail])"

          def text_of(x):
              vals=re.findall(r'<w:t(?:\s[^>]*)?>([\s\S]*?)</w:t>',x)
              return ''.join(html.unescape(v) for v in vals).strip()

          def xml_escape(s):
              return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

          def replace_para_text(p,s):
              first=True
              def repl(m):
                  nonlocal first
                  attrs=m.group(1) or ""
                  if first:
                      first=False
                      return f'<w:t{attrs}>{xml_escape(s)}</w:t>'
                  return f'<w:t{attrs}></w:t>'
              return re.sub(r'<w:t(\s[^>]*)?>([\s\S]*?)</w:t>',repl,p)

          with ZipFile(path,"r") as zin:
              xml=zin.read("word/document.xml").decode("utf-8")
              matches=list(re.finditer(r'<w:p\b[\s\S]*?</w:p>',xml))
              texts=[text_of(m.group(0)) for m in matches]

              print("ZH_TITLE="+zh_title)
              print("ZH_AUTHOR="+zh_author)
              print("ZH_AFF="+zh_aff)

              for target in [expected_en_title, expected_en_author, old_en_aff, new_en_aff]:
                  print("PRESENT", target, target in texts)

              title_ok=expected_en_title in texts
              author_ok=expected_en_author in texts
              aff_ok=new_en_aff in texts
              comm_ok=any("Corresponding author:" in t for t in texts)
              country_ok=any(", China" in t and "Corresponding author:" in t for t in texts)

              print(f"CHECK title_ok={title_ok} author_ok={author_ok} aff_ok={aff_ok} comm_ok={comm_ok} country_ok={country_ok}")

              changed=False
              if not aff_ok and old_en_aff in texts:
                  idx=texts.index(old_en_aff)
                  m=matches[idx]
                  newp=replace_para_text(m.group(0),new_en_aff)
                  xml=xml[:m.start()]+newp+xml[m.end():]
                  changed=True
                  print("FIXED_EN_AFFILIATION_TEMPLATE")

              # No semantic rewriting of title/author placeholder unless structurally missing.
              if not title_ok:
                  raise RuntimeError("English title missing or does not match expected translation")
              if not author_ok:
                  raise RuntimeError("English author placeholder missing")
              if not comm_ok or not country_ok:
                  raise RuntimeError("corresponding author/country structure missing")

              if changed:
                  with ZipFile(tmp,"w",ZIP_DEFLATED) as zout:
                      for item in zin.infolist():
                          data=xml.encode("utf-8") if item.filename=="word/document.xml" else zin.read(item.filename)
                          zout.writestr(item,data)
                  shutil.move(tmp,path)
                  print("STATUS=FIXED")
              else:
                  print("STATUS=COMPLIANT")
          PY

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk
          fc-cache -fv >/dev/null

      - name: Render for QA
        shell: bash
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          pdfinfo qa_render/2026.09.18v.pdf | grep -E 'Pages|Page size'

      - uses: actions/upload-artifact@v4
        with:
          name: journal-requirement-08-qa
          path: qa_render/
          if-no-files-found: error

      - name: Commit only if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.18v.docx
          if git diff --cached --quiet; then
            echo "NO_CHANGE"
            exit 0
          fi
          git commit -m "apply journal requirement 8 English front matter"
          git push
