name: Inspect abstract conclusion v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect_abstract_conclusion.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect target paragraphs
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          p="word_output/2026.09.19v2.docx"
          NS={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          with ZipFile(p) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          body=root.find("w:body",NS)
          def txt(e):
              return "".join(x.text or "" for x in e.iter() if x.tag.endswith("}t"))
          for i,e in enumerate(list(body)):
              if not e.tag.endswith("}p"): continue
              t=txt(e).strip()
              if i<=15 or t=="3 结论" or (i>0 and "实验验证了" in t):
                  print(i, t)
          PY
