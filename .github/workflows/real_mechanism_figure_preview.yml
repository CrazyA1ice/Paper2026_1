name: Real mechanism figure preview

on:
  push:
    branches:
      - chatgpt-real-figure-preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Generate figure from repository data
        run: |
          cd abilene_forecasting
          python paper_figures/generate_real_mechanism_figure.py

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-mechanism-figure-preview
          path: |
            abilene_forecasting/paper_figures/real_preview/real_multiscale_mechanism_figure.png
            abilene_forecasting/paper_figures/real_preview/real_multiscale_mechanism_source.csv
            abilene_forecasting/paper_figures/real_preview/real_multiscale_mechanism_audit.json
          if-no-files-found: error
