name: Temporary manuscript render QA

on:
  push:
    paths:
      - ".github/workflows/render_manuscript_qa.yml"

permissions:
  contents: read

jobs:
  render:
    if: github.event.head_commit.message == 'temporary manuscript render QA workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice poppler-utils fonts-noto-cjk && fc-cache -fv >/dev/null
      - name: Render DOCX
        run: |
          mkdir -p qa_render
          libreoffice --headless --convert-to pdf --outdir qa_render word_output/2026.09.18v.docx
          pdftoppm -png -r 120 qa_render/2026.09.18v.pdf qa_render/page
          ls -lh qa_render
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-render-qa
          path: qa_render/
          if-no-files-found: error
