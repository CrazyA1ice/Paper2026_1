name: Build cumulative v22 working draft
on:
  push:
    branches: [main]
    paths:
      - 'word_output/v22_working_pipeline.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: python -m pip install python-docx
      - name: Build working draft
        run: python word_output/v22_working_pipeline.py
      - name: Commit working draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/v22_working.docx
          git commit -m "Update cumulative v22 working draft" || exit 0
          git push
