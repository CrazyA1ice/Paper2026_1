name: Build final v22 manuscript
on:
  push:
    branches: [main]
    paths:
      - 'word_output/v22_working_pipeline.py'
      - '.github/workflows/build_v22_working.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libreoffice-writer poppler-utils
          python -m pip install --upgrade pip
          python -m pip install python-docx numpy matplotlib pillow

      - name: Build final v22
        run: python word_output/v22_working_pipeline.py

      - name: Audit final v22
        run: |
          python - <<'PY'
          from docx import Document
          p="word_output/2026.09.22v22.docx"
          d=Document(p)
          text="\n".join(x.text for x in d.paragraphs)
          assert len(d.tables)==3
          assert len(d.inline_shapes)==6
          required=[
              "图2 Abilene单个OD变量的多尺度序列构造与平均池化示意",
              "图4 Abilene与GÉANT代表性测试窗口的24步预测及逐步误差差值",
              "4.06%","4.43%","29.89%","46.83%","1.67%","4.68%",
              "0.186","0.434","0.257","0.319","0.424","0.283","0.318","0.399",
              "13.7%","逐步误差差值"
          ]
          for x in required:
              assert x in text, x
          print("paragraphs", len(d.paragraphs), "tables", len(d.tables), "figures", len(d.inline_shapes))
          PY

      - name: Render Word and PDF
        run: |
          rm -rf word_output/render_v22_word
          mkdir -p word_output/render_v22_word
          libreoffice --headless --convert-to pdf --outdir word_output/render_v22_word word_output/2026.09.22v22.docx
          pdftoppm -png -r 180 word_output/render_v22_word/2026.09.22v22.pdf word_output/render_v22_word/page
          pages=$(find word_output/render_v22_word -name 'page-*.png' | wc -l)
          echo "Rendered pages: $pages"
          test "$pages" -ge 8
          test "$pages" -le 20

      - name: Upload final v22 QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-v22-qa
          path: |
            word_output/2026.09.22v22.docx
            word_output/render_v22_word/2026.09.22v22.pdf
            word_output/render_v22_word/page-*.png
          retention-days: 2

      - name: Commit final v22
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/2026.09.22v22.docx word_output/v22_assets/ word_output/render_v22_word/
          git commit -m "Refresh v22 with publication-grade figures" || exit 0
          git push
