name: Extract v18 text
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract_v18_text.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install python-docx
        run: python -m pip install python-docx
      - name: Extract paragraphs
        run: python word_output/extract_v18_text.py
      - name: Commit dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_output/v18_text_dump.txt
          git commit -m "Extract v18 manuscript text for prose review" || exit 0
          git push
