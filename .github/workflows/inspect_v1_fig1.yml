name: Inspect v1 Figure 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect_v1_fig1.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Figure 1
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          from lxml import etree
          docx=Path("word_output/2026.09.19v1.docx")
          out=Path("v1_fig1_extract")
          out.mkdir(exist_ok=True)
          NS={
            "w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main",
            "a":"http://schemas.openxmlformats.org/drawingml/2006/main",
            "r":"http://schemas.openxmlformats.org/officeDocument/2006/relationships",
            "pr":"http://schemas.openxmlformats.org/package/2006/relationships",
          }
          with ZipFile(docx) as z:
            doc=etree.fromstring(z.read("word/document.xml"))
            rels=etree.fromstring(z.read("word/_rels/document.xml.rels"))
            paras=doc.xpath("/w:document/w:body/w:p",namespaces=NS)
            def txt(p):
              return "".join(p.xpath(".//w:t/text()",namespaces=NS))
            cap=next(i for i,p in enumerate(paras) if txt(p).strip()=="图1 自适应多尺度预测框架")
            fig=None
            for i in range(cap-1,max(-1,cap-5),-1):
              if paras[i].xpath(".//a:blip",namespaces=NS):
                fig=paras[i]; break
            blip=fig.xpath(".//a:blip",namespaces=NS)[0]
            rid=blip.get("{%s}embed"%NS["r"])
            rel=rels.xpath(f"/pr:Relationships/pr:Relationship[@Id='{rid}']",namespaces=NS)[0]
            target=rel.get("Target")
            data=z.read("word/"+target)
            ext=Path(target).suffix or ".bin"
            p=out/("fig1_v1"+ext)
            p.write_bytes(data)
            print("caption_index",cap)
            print("relationship",rid)
            print("target",target)
            print("bytes",len(data))
            print("saved",p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v1-fig1
          path: v1_fig1_extract/*
          retention-days: 2
