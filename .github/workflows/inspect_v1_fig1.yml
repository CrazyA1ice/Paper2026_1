name: Inspect v1 Figure 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect_v1_fig1.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Figure 1
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          docx=Path("word_output/2026.09.19v1.docx")
          out=Path("v1_fig1_extract")
          out.mkdir(exist_ok=True)
          NS={
            "w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main",
            "a":"http://schemas.openxmlformats.org/drawingml/2006/main",
            "r":"http://schemas.openxmlformats.org/officeDocument/2006/relationships",
            "pr":"http://schemas.openxmlformats.org/package/2006/relationships",
          }
          with ZipFile(docx) as z:
            doc=ET.fromstring(z.read("word/document.xml"))
            rels=ET.fromstring(z.read("word/_rels/document.xml.rels"))
            body=doc.find("w:body",NS)\n            paras=body.findall("w:p",NS)
            def txt(p):
              return "".join(e.text or "" for e in p.iter() if e.tag.endswith("}t"))
            cap=next(i for i,p in enumerate(paras) if txt(p).strip()=="图1 自适应多尺度预测框架")
            fig=None
            for i in range(cap-1,max(-1,cap-5),-1):
              if any(e.tag.endswith("}blip") for e in paras[i].iter()):
                fig=paras[i]; break
            blip=next(e for e in fig.iter() if e.tag.endswith("}blip"))
            rid=blip.get("{%s}embed"%NS["r"])
            rel=next(e for e in rels if e.get("Id")==rid)
            target=rel.get("Target")
            data=z.read("word/"+target)
            ext=Path(target).suffix or ".bin"
            p=out/("fig1_v1"+ext)
            p.write_bytes(data)
            print("caption_index",cap)
            print("relationship",rid)
            print("target",target)
            print("bytes",len(data))
            print("saved",p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v1-fig1
          path: v1_fig1_extract/*
          retention-days: 2
