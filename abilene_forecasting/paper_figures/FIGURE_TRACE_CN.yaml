script:
  file: generate_paper_figures.py
  git_blob_sha: 5737eef3bad257ebc6d163c8f4694093e7a87759

figure_table_trace:
  - artifact_id: fig-1
    source_data: {dataset_id: method-specification-v2, file: PAPER_WRITING_INPUT_CN.md}
    transformation: {script: generate_paper_figures.py, function: figure_1_method_schematic}
    outputs:
      color: paper_figures/exports/color/fig1_method_schematic_color.jpg
      grayscale: paper_figures/exports/grayscale/fig1_method_schematic_grayscale.jpg
    manuscript_usage: color
    caption_claim: 图1图体仅展示方法结构，不包含图序、图题或段落式说明；图题由Word在图下方单独排版。
    supported_manuscript_claims:
      - {claim: 本文使用尺度1、2和4的DLinear专家，并根据样本级统计路由生成Softmax尺度权重。, locator: 方法章节}
      - {claim: 输入长度为96，预测长度为24，变量维度以一般符号C表示。, locator: 问题定义与数据预处理}
    limitations: [图中输入/输出热图仅为张量流示意，不作为实验性能证据；数值性能以实验表格和结果图为准。]

  - artifact_id: fig-2
    source_data: {dataset_id: core-v2-eight-seed-pairing, file: source_data_v2/fig2_weight_pairing_8seeds.csv}
    transformation: {script: generate_paper_figures.py, function: figure_2_core_weight_pairing}
    outputs:
      color: paper_figures/exports/color/fig2_core_weight_pairing_color.jpg
      grayscale: paper_figures/exports/grayscale/fig2_core_weight_pairing_grayscale.jpg
    manuscript_usage: color
    caption_claim: 固定等权与自适应多尺度在Abilene和GÉANT上的8随机种子MSE配对结果。
    supported_manuscript_claims:
      - {claim: 自适应多尺度的平均MSE在两个数据集上均低于固定等权多尺度。, locator: 第2.4节}
      - {claim: 自适应模型并非所有随机种子均改善，GÉANT跨种子波动更明显。, locator: 第2.4节}
    limitations: [图中只展示MSE；MAE及统计量以表3和正文为准。]

  - artifact_id: fig-3
    source_data: {dataset_id: router-weights-seed42-two-datasets, file: source_data_v2/fig3_router_seed42_first150.csv}
    transformation: {script: generate_paper_figures.py, function: figure_3_router_weight_dynamics}
    outputs:
      color: paper_figures/exports/color/fig3_router_weight_dynamics_color.jpg
      grayscale: paper_figures/exports/grayscale/fig3_router_weight_dynamics_grayscale.jpg
    manuscript_usage: color
    caption_claim: 两数据集随机种子42前150个测试窗口的三尺度Softmax权重随样本变化。
    supported_manuscript_claims:
      - {claim: 路由器没有退化为固定1/3平均融合，而是随输入窗口动态改变尺度组合。, locator: 第2.5节}
    limitations: [固定展示seed42和前150个窗口，仅用于机制可视化；不用于性能显著性判断或稳定尺度语义解释。]
